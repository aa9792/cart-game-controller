<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汪汪隊大反擊：修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1e293b;
            color: #f1f5f9;
            overscroll-behavior: none;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 預防性 padding */
            padding: 10px; 
        }

        .game-font { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; }
        .title-shadow { text-shadow: 2px 2px 0px #000; }

        #game-canvas {
            cursor: crosshair;
            border: 4px solid #fbbf24;
            border-radius: 12px;
            background-color: #0f172a;
            /* 確保畫布有寬高，即使 CSS 載入失敗 */
            width: 100%;
            height: auto;
            touch-action: none;
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.3);
            display: block; /* 確保顯示 */
        }

        /* 簡單的動畫定義，確保相容性 */
        .shake { animation: shakeAnim 0.3s linear; }
        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 0); }
            75% { transform: translate(5px, 0); }
            100% { transform: translate(0, 0); }
        }

        .center-feedback {
            position: absolute; left: 50%; top: 45%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            z-index: 150;
            animation: popUp 1s forwards;
            width: 100%; 
        }
        @keyframes popUp {
            0% { transform: translate(-50%, 0%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
        }

        /* Icon 樣式 */
        .icon-unit { font-size: 1rem; margin-right: 1px; }
        .is-lost { opacity: 0.3; filter: grayscale(100%); }

        .score-board {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #475569;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            font-family: monospace;
            font-weight: bold;
        }

        /* 讀取畫面，避免JS載入慢時畫面全黑 */
        #loading-msg {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: yellow; font-size: 20px; font-weight: bold;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="loading-msg">遊戲載入中...</div>

    <div id="screen-effect" class="fixed inset-0 pointer-events-none z-[100]"></div>

    <div class="w-full max-w-lg space-y-2 relative" id="game-container" style="display:none;">
        
        <div class="flex flex-row justify-between items-center">
            <h1 class="text-2xl font-black text-yellow-400 game-font title-shadow transform -rotate-1">
                🚀 汪汪隊反擊
            </h1>
            <div class="flex gap-2">
                <button onclick="showPrologue()" class="px-3 py-1 bg-blue-600 rounded-lg font-bold text-white text-xs shadow-md border-b-2 border-blue-800 active:border-b-0 active:translate-y-[2px]">
                    📜 說明
                </button>
                <button onclick="resetGame()" class="px-3 py-1 bg-rose-600 rounded-lg font-bold text-white text-xs shadow-md border-b-2 border-rose-800 active:border-b-0 active:translate-y-[2px]">
                    🔄 重來
                </button>
            </div>
        </div>

        <div class="score-board text-sm">
            <div class="text-yellow-400">
                🏆 最高: <span id="high-score" class="text-white">0</span>
            </div>
            <div class="text-green-400">
                ⭐ 得分: <span id="current-score" class="text-white text-lg">0</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div id="dog-panel" class="bg-blue-900/60 p-2 rounded-xl border border-blue-400">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-black text-blue-300 text-xs">🐶 汪汪隊</span>
                    <span id="dog-percent" class="font-mono text-white text-xs">100%</span>
                </div>
