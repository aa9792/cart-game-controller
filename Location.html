<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汪汪隊大反擊：防卡死版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap');
        
        /* 基礎樣式，防止 CSS 載入失敗時畫面跑版 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1e293b;
            color: #f1f5f9;
            overscroll-behavior: none;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-canvas {
            background-color: #0f172a;
            border: 4px solid #fbbf24;
            border-radius: 12px;
            width: 100%;
            height: auto;
            touch-action: none;
            display: block;
        }

        /* Loading 遮罩樣式 */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        
        .loading-text {
            color: #fbbf24; font-size: 24px; font-weight: bold;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* 強制啟動按鈕 (預設隱藏) */
        #force-start-btn {
            display: none;
            margin-top: 20px;
            padding: 15px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 遊戲內元素 */
        .score-board {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #475569;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 14px;
        }

        .center-feedback {
            position: absolute; left: 50%; top: 45%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            z-index: 150;
            animation: popUp 0.8s forwards;
            width: 100%; white-space: nowrap;
        }
        @keyframes popUp {
            0% { transform: translate(-50%, 0%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
        }

        .icon-unit { font-size: 1rem; margin-right: 1px; }
        .is-lost { opacity: 0.3; filter: grayscale(100%); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-text">🚀 遊戲載入中...</div>
        <button id="force-start-btn" onclick="manualStart()">👉 點此直接開始</button>
        <div style="margin-top:10px; font-size:12px; color:#64748b;">若畫面卡住請點擊按鈕</div>
    </div>

    <div id="screen-effect" class="fixed inset-0 pointer-events-none z-[100]"></div>

    <div class="w-full max-w-lg space-y-2 relative" id="game-container" style="display:none;">
        
        <div class="flex flex-row justify-between items-center">
            <h1 class="text-2xl font-black text-yellow-400 transform -rotate-1" style="text-shadow: 2px 2px 0 #000;">
                🚀 汪汪隊反擊
            </h1>
            <div class="flex gap-2">
                <button onclick="showPrologue()" class="px-3 py-1 bg-blue-600 rounded-lg font-bold text-white text-xs shadow-md border-b-2 border-blue-800 active:border-b-0 active:translate-y-[2px]">
                    📜 說明
                </button>
                <button onclick="resetGame()" class="px-3 py-1 bg-rose-600 rounded-lg font-bold text-white text-xs shadow-md border-b-2 border-rose-800 active:border-b-0 active:translate-y-[2px]">
                    🔄 重來
                </button>
            </div>
        </div>

        <div class="score-board">
            <div style="color:#fbbf24">
                🏆 最高: <span id="high-score" style="color:white">0</span>
            </div>
            <div style="color:#4ade80">
                ⭐ 得分: <span id="current-score" style="color:white; font-size:1.1rem">0</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div id="dog-panel" class="bg-blue-900/60 p-2 rounded-xl border border-blue-400">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-black text-blue-300 text-xs">🐶 汪汪隊</span>
                    <span id="dog-percent" class="font-mono text-white text-xs">100%</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full mb-1">
                    <div id="dog-bar" class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
                </div>
                <div id="dog-icons" class="flex flex-wrap h-4 overflow-hidden"></div>
            </div>

            <div id="cat-panel" class="bg-red-900/60 p-2 rounded-xl border border-red-400 text-right">
                <div class="flex justify-between items-center mb-1">
                    <span id="cat-percent" class="font-mono text-white text-xs">100%</span>
                    <span class="font-black text-red-300 text-xs">喵喵軍團 😼</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full mb-1 flex justify-end">
                    <div id="cat-bar" class="bg-red-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
                </div>
                <div id="cat-icons" class="flex flex-wrap justify-end h-4 overflow-hidden"></div>
            </div>
        </div>

        <div id="coord-banner" class="w-full py-2 px-3 bg-yellow-500 rounded-lg flex items-center justify-between gap-2 shadow-sm">
            <div class="flex items-center gap-1">
                <span class="animate-bounce">📡</span>
                <span class="text-black font-bold text-xs">目標位置：</span>
            </div>
            <div class="bg-black/30 rounded px-2 py-1">
                 <span id="target-coords" class="text-xl font-mono font-black text-white tracking-widest">
                    Wait...
                </span>
            </div>
        </div>

        <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden shadow-2xl bg-[#0f172a] border-2 border-yellow-600">
            <canvas id="game-canvas" width="800" height="600" class="w-full h-full object-contain"></canvas>
            <div id="effect-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        </div>

        <p class="font-bold text-xs mt-1 text-center text-yellow-400 animate-pulse">
            👇 點擊地圖上的座標點發射！ 👇
        </p>
    </div>

    <script>
        // 將所有變數宣告移到全域，但初始化放進函數
        let canvas, ctx, effectLayer;
        let ui = {};
        
        // 遊戲常數
        const GRID_COLS = 5; 
        const GRID_ROWS = 5; 
        const PADDING = 70; 
        const xValues = [-240, -120, 0, 120, 240];
        const yValues = [180, 90, 0, -90, -180];

        // 遊戲狀態
        let currentTarget = { x: 0, y: 0 };
        let particles = []; 
        let craters = [];    
        let dogHP = 100;
        let catHP = 100;
        let isGameOver = false;
        let radarAngle = 0;
        let score = 0;
        let highScore = 0;
        let mousePos = { x: -100, y: -100 };
        let nearestGridPoint = null;
        let audioCtx = null;
        let gameLoopId = null;
        let canUseConic = false;

        // 安全的 Audio Context 啟動
        function initAudio() {
            if (!audioCtx) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                } catch(e) { console.log('Audio not supported'); }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'hit' || type === 'crit') {
                    const isCrit = type === 'crit';
                    osc.frequency.setValueAtTime(isCrit ? 150 : 200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.type = isCrit ? 'square' : 'sine';
                } else if (type === 'miss') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.4);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                }
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 0.5);
            } catch(e) {}
        }

        // 手動啟動（當自動載入失敗時）
        function manualStart() {
            initSystem();
        }

        // 系統初始化核心
        function initSystem() {
            try {
                // 1. 抓取 DOM 元素
                canvas = document.getElementById('game-canvas');
                if(!canvas) return; // 如果還沒準備好就跳過
                ctx = canvas.getContext('2d');
                effectLayer = document.getElementById('effect-layer');
                
                ui = {
                    dogBar: document.getElementById('dog-bar'),
                    dogPercent: document.getElementById('dog-percent'),
                    dogIcons: document.getElementById('dog-icons'),
                    dogPanel: document.getElementById('dog-panel'),
                    catBar: document.getElementById('cat-bar'),
                    catPercent: document.getElementById('cat-percent'),
                    catIcons: document.getElementById('cat-icons'),
                    catPanel: document.getElementById('cat-panel'),
                    targetCoords: document.getElementById('target-coords'),
                    score: document.getElementById('current-score'),
                    highScore: document.getElementById('high-score'),
                    container: document.getElementById('game-container'),
                    loading: document.getElementById('loading-screen')
                };

                // 2. 檢測功能支援
                canUseConic = typeof ctx.createConicGradient === 'function';
                try {
                    highScore = localStorage.getItem('paw_highscore_v3') || 0;
                } catch(e) { highScore = 0; }

                // 3. 綁定事件
                canvas.addEventListener('mousedown', handleStart);
                canvas.addEventListener('mousemove', handleMove);
                canvas.addEventListener('touchstart', handleStart, {passive: false});
                canvas.addEventListener('touchmove', handleMove, {passive: false});
                canvas.addEventListener('mouseleave', () => { mousePos = {x:-999, y:-999}; nearestGridPoint = null; });

                // 4. 啟動遊戲
                ui.loading.style.display = 'none';
                ui.container.style.display = 'block';
                
                initGame();
                if(!gameLoopId) {
                    gameLoopId = requestAnimationFrame(draw);
                }
                setTimeout(showPrologue, 300);

            } catch(e) {
                console.error("Init Error:", e);
                alert("初始化失敗，請重新整理網頁");
            }
        }

        function initGame() {
            isGameOver = false;
            dogHP = 100; catHP = 100;
            score = 0;
            particles = []; craters = [];
            updateUI();
            spawnTarget();
        }

        function spawnTarget() {
            const rx = xValues[Math.floor(Math.random() * xValues.length)];
            const ry = yValues[Math.floor(Math.random() * yValues.length)];
            currentTarget = { x: rx, y: ry };
            if(ui.targetCoords) ui.targetCoords.innerText = `${rx}, ${ry}`;
        }

        function updateUI() {
            if(!ui.dogBar) return;
            dogHP = Math.max(0, dogHP);
            catHP = Math.max(0, catHP);
            
            ui.dogBar.style.width = dogHP + '%';
            ui.dogPercent.innerText = dogHP + '%';
            ui.catBar.style.width = catHP + '%';
            ui.catPercent.innerText = catHP + '%';
            ui.score.innerText = score;
            ui.highScore.innerText = highScore;

            renderIcons(ui.dogIcons, dogHP, '🐶');
            renderIcons(ui.catIcons, catHP, '😼');

            if (!isGameOver) {
                if (catHP <= 0) { isGameOver = true; endGame("大勝利！肉乾奪回！🎉", true); }
                else if (dogHP <= 0) { isGameOver = true; endGame("失敗了...肉乾沒了...😭", false); }
            }
        }

        function renderIcons(container, hp, char) {
            let html = "";
            const active = Math.ceil(hp / 10);
            for(let i=1; i<=10; i++) {
                const isLost = char.includes('🐶') ? i > active : (11-i) > active;
                html += `<span class="icon-unit ${isLost ? 'is-lost' : ''}">${char}</span>`;
            }
            container.innerHTML = html;
        }

        function getCanvasPoint(gx, gy) {
            const drawW = canvas.width - (PADDING * 2);
            const drawH = canvas.height - (PADDING * 2);
            const normX = (gx + 240) / 480; 
            const cx = PADDING + normX * drawW;
            const normY = (180 - gy) / 360;
            const cy = PADDING + normY * drawH;
            return { x: cx, y: cy };
        }

        function draw() {
            // 清除畫面
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            radarAngle += 0.015;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (canUseConic) {
                const gradient = ctx.createConicGradient(radarAngle, cx, cy);
                gradient.addColorStop(0, 'rgba(251, 191, 36, 0)');
                gradient.addColorStop(0.15, 'rgba(251, 191, 36, 0.15)');
                gradient.addColorStop(1, 'rgba(251, 191, 36, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = `rgba(251, 191, 36, 0.05)`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 網格與文字
            ctx.lineWidth = 2;
            ctx.font = "900 20px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            xValues.forEach(val => {
                const p = getCanvasPoint(val, 0);
                ctx.beginPath();
                ctx.strokeStyle = val === 0 ? '#60a5fa' : '#334155'; 
                ctx.lineWidth = val === 0 ? 3 : 2;
                ctx.moveTo(p.x, PADDING - 20); ctx.lineTo(p.x, canvas.height - PADDING + 20);
                ctx.stroke();
                ctx.fillStyle = val === 0 ? '#60a5fa' : '#94a3b8';
                ctx.fillText(val, p.x, canvas.height - PADDING + 50);
            });

            yValues.forEach(val => {
                const p = getCanvasPoint(0, val);
                ctx.beginPath();
                ctx.strokeStyle = val === 0 ? '#f87171' : '#334155';
                ctx.lineWidth = val === 0 ? 3 : 2;
                ctx.moveTo(PADDING - 20, p.y); ctx.lineTo(canvas.width - PADDING + 20, p.y);
                ctx.stroke();
                ctx.fillStyle = val === 0 ? '#f87171' : '#94a3b8';
                ctx.fillText(val, PADDING - 50, p.y);
            });

            // 彈坑
            craters.forEach((c, i) => {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 100, 100, ${c.alpha})`;
                ctx.lineWidth = 4;
                const size = c.size;
                ctx.moveTo(c.x - size, c.y - size); ctx.lineTo(c.x + size, c.y + size);
                ctx.moveTo(c.x + size, c.y - size); ctx.lineTo(c.x - size, c.y + size);
                ctx.stroke();
                c.alpha -= 0.005;
                if(c.alpha <= 0) craters.splice(i, 1);
            });

            // 游標邏輯
            if (!isGameOver) {
                let minDist = 9999;
                let targetGrid = null;

                for (let x of xValues) {
                    for (let y of yValues) {
                        const pt = getCanvasPoint(x, y);
                        const dist = Math.sqrt((mousePos.x - pt.x)**2 + (mousePos.y - pt.y)**2);
                        if (dist < 70) { 
                            if (dist < minDist) {
                                minDist = dist;
                                targetGrid = { gx: x, gy: y, cx: pt.x, cy: pt.y };
                            }
                        }
                    }
                }
                
                if (targetGrid && (!nearestGridPoint || nearestGridPoint.gx !== targetGrid.gx)) {
                    playSound('pop');
                }
                nearestGridPoint = targetGrid;

                if(mousePos.x > 0) {
                    ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(mousePos.x, 0); ctx.lineTo(mousePos.x, canvas.height);
                    ctx.moveTo(0, mousePos.y); ctx.lineTo(canvas.width, mousePos.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                if (nearestGridPoint) {
                    const pulse = Math.sin(Date.now() / 100) * 5;
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(nearestGridPoint.cx, nearestGridPoint.cy, 30 + pulse, 0, Math.PI*2);
                    ctx.stroke();
                    
                    ctx.fillStyle = 'rgba(251, 191, 36, 0.9)';
                    const labelX = Math.min(Math.max(mousePos.x, 60), canvas.width - 60);
                    const labelY = Math.max(mousePos.y - 60, 40);
                    ctx.fillRect(labelX - 50, labelY - 20, 100, 30);
                    ctx.fillStyle = '#000';
                    ctx.font = "bold 18px sans-serif";
                    ctx.fillText(`${nearestGridPoint.gx}, ${nearestGridPoint.gy}`, labelX, labelY - 5);
                }
            }

            // 粒子
            particles.forEach((p, i) => {
                ctx.beginPath();
                ctx.fillStyle = p.color;
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                p.x += p.vx; p.y += p.vy;
                p.life -= p.decay; p.size *= 0.95;
                if (p.life <= 0) particles.splice(i, 1);
            });

            gameLoopId = requestAnimationFrame(draw);
        }

        // 輸入處理
        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if(e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            if (clientX === undefined) return mousePos;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function handleStart(e) {
            if (isGameOver) return;
            initAudio();
            if(e.cancelable && e.type === 'touchstart') e.preventDefault();
            
            mousePos = getEventPos(e);
            
            // 重新計算最近點
            let minDist = 9999;
            let targetGrid = null;
            for (let x of xValues) {
                for (let y of yValues) {
                    const pt = getCanvasPoint(x, y);
                    const dist = Math.sqrt((mousePos.x - pt.x)**2 + (mousePos.y - pt.y)**2);
                    if (dist < 70) {
                        if (dist < minDist) {
                            minDist = dist;
                            targetGrid = { gx: x, gy: y, cx: pt.x, cy: pt.y };
                        }
                    }
                }
            }
            nearestGridPoint = targetGrid;

            if (nearestGridPoint) {
                attemptAttack(nearestGridPoint);
            } else {
                createExplosion(mousePos.x, mousePos.y, ['#94a3b8'], 5);
                playSound('miss');
            }
        }

        function handleMove(e) {
            if (isGameOver) return;
            if(e.cancelable) e.preventDefault();
            mousePos = getEventPos(e);
        }

        function attemptAttack(target) {
            if (target.gx === currentTarget.x && target.gy === currentTarget.y) {
                // 命中
                const isCrit = Math.random() < 0.3;
                const dmg = isCrit ? 15 : Math.floor(Math.random() * 5) + 5;
                score += isCrit ? 200 : 100;
                catHP -= dmg;
                
                playSound(isCrit ? 'crit' : 'hit');
                createExplosion(target.cx, target.cy, isCrit ? ['#f59e0b', 'red'] : ['orange'], isCrit ? 40 : 20);
                showFeedback(isCrit ? `爆擊! -${dmg}` : `命中! -${dmg}`, isCrit ? 'text-yellow-300' : 'text-green-300', isCrit ? '💥' : '💢');
                spawnTarget(); 
            } else {
                // 沒中
                const isFriendly = Math.random() < 0.3;
                if (isFriendly) {
                    dogHP -= 10;
                    score = Math.max(0, score - 50);
                    playSound('miss');
                    createExplosion(target.cx, target.cy, ['pink'], 15);
                    showFeedback("打到隊友! -10", "text-pink-300", "😭");
                } else {
                    const dmg = 3;
                    dogHP -= dmg;
                    playSound('miss');
                    createExplosion(target.cx, target.cy, ['gray'], 10);
                    craters.push({x: target.cx, y: target.cy, size: 20, alpha: 1});
                    showFeedback(`打錯位置 -${dmg}`, "text-gray-300", "💨");
                }
            }
            updateUI();
        }

        function createExplosion(x, y, colors, count) {
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.02,
                    size: Math.random() * 5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function showFeedback(text, colorClass, emoji) {
            const el = document.createElement('div');
            el.className = `center-feedback ${colorClass}`;
            el.innerHTML = `<div style="font-size:3rem; text-shadow:0 0 10px black">${emoji}</div><div style="font-size:2rem; background:rgba(0,0,0,0.7); display:inline-block; padding:5px 20px; border-radius:10px;">${text}</div>`;
            effectLayer.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function endGame(msg, isVictory) {
            try {
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('paw_highscore_v3', highScore);
                }
            } catch(e) {}
            
            const modal = document.createElement('div');
            modal.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:200;";
            modal.innerHTML = `
                <div class="text-center p-6 border-4 border-white rounded-2xl bg-gray-800">
                    <div style="font-size:4rem">${isVictory ? '🏆' : '😿'}</div>
                    <h2 class="text-3xl font-bold text-white mb-2">${isVictory ? '勝利！' : '失敗...'}</h2>
                    <p class="text-xl text-yellow-400 mb-4">得分：${score}</p>
                    <button onclick="this.parentNode.parentNode.remove(); resetGame();" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold text-xl">再來一次</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showPrologue() {
            const modal = document.createElement('div');
            modal.id = 'prologue';
            modal.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;";
            modal.innerHTML = `
                <div class="text-center p-6 border-2 border-yellow-500 rounded-2xl bg-gray-900 max-w-sm w-full">
                    <h2 class="text-2xl font-bold text-yellow-400 mb-4">📢 任務說明</h2>
                    <p class="text-white text-left mb-4 leading-relaxed">
                        根據上方黃色框框顯示的座標 <span class="bg-yellow-500 text-black px-1 rounded">X, Y</span>，
                        點擊地圖上的對應位置發射！
                    </p>
                    <button onclick="document.getElementById('prologue').remove(); initAudio();" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-orange-500 text-white font-bold rounded-xl">收到！出發！</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function resetGame() {
            initGame();
        }

        // 雙重保險啟動
        // 1. DOMContentLoaded：標準啟動
        document.addEventListener('DOMContentLoaded', () => {
            // 給瀏覽器一點時間準備
            setTimeout(initSystem, 100);
        });

        // 2. 逾時保險：如果2秒後畫面還是卡在Loading，顯示強制啟動按鈕
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            const gameContainer = document.getElementById('game-container');
            // 如果還在 Loading 且遊戲沒出現
            if (loadingScreen && gameContainer.style.display === 'none') {
                document.getElementById('force-start-btn').style.display = 'block';
            }
        }, 2000);

    </script>
</body>
</html>
