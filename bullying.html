                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];

        const useAudio = () => {
            const [isMuted, setIsMuted] = useState(false);
            const audioContextRef = useRef(null);

            const getContext = () => {
                if (!audioContextRef.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContextRef.current = new AudioContext();
                }
                return audioContextRef.current;
            };

            const playTone = (freq, type, duration, startTime = 0) => {
                if (isMuted) return;
                const ctx = getContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + startTime);
                osc.stop(ctx.currentTime + startTime + duration);
            };

            const playSound = useCallback(async (soundType) => {
                if (isMuted) return;
                const ctx = getContext();
                if (ctx.state === 'suspended') {
                    try { await ctx.resume(); } catch (e) { console.error(e); }
                }

                switch (soundType) {
                    case 'click': 
                        playTone(300, 'square', 0.05); 
                        playTone(200, 'sawtooth', 0.05, 0.05);
                        break;
                    case 'test': 
                        playTone(440, 'square', 0.1); 
                        playTone(554, 'square', 0.1, 0.1); 
                        playTone(659, 'square', 0.2, 0.2); 
                        break;
                    case 'correct': 
                        playTone(523, 'sine', 0.1); 
                        playTone(659, 'sine', 0.1, 0.1); 
                        playTone(880, 'triangle', 0.4, 0.2); 
                        break;
                    case 'wrong': 
                        playTone(150, 'sawtooth', 0.3); 
                        playTone(100, 'sawtooth', 0.4, 0.15); 
                        break;
                    case 'victory':

                        break;
                    case 'alarm': 
                        playTone(800, 'square', 0.1); 
                        playTone(800, 'square', 0.1, 0.15); 
                        break;
                    default: break;
                }
            }, [isMuted]);

            return { isMuted, setIsMuted, playSound };
        };

        const useTTS = () => {

            const synth = window.speechSynthesis;

            const speak = (text) => {
                if (!synth) return;
                cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.0;
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                synth.speak(utterance);
            };

            const cancel = () => {
                if (synth) {
                    synth.cancel();
                    setIsSpeaking(false);

            };

            return { speak, cancel, isSpeaking };

                                    icon = <Hammer className="w-6 h-6 animate-bounce text-indigo-500" />;
                                    shadow = "shadow-xl shadow-indigo-200 ring-4 ring-indigo-50";
                                    scale = "scale-110";
                                    content = <span className="text-xs font-bold mt-1 text-indigo-600">施工中</span>;
                                } else if (isLocked) {
                                    nodeColor = "bg-slate-100/50 border-slate-200/50 text-slate-300";
                                    icon = <Lock className="w-4 h-4 opacity-30" />;
                                    content = null;
                                }

                                return (
                                    <button
                                        key={land.id}
                                        onClick={() => !isLocked && handleLandClick(land)}
                                        disabled={land.status === 'conquered' || isLocked}
                                        style={{ left: land.mapPos.left, top: land.mapPos.top }}
                                        className={`
                                            absolute transform -translate-x-1/2 -translate-y-1/2 w-32 h-16 rounded-xl border-2
                                            flex flex-col items-center justify-center cursor-pointer transition-all duration-300 z-10
                                            ${nodeColor} ${shadow} ${scale}
                                            ${!isLocked && land.status !== 'conquered' ? 'hover:-translate-y-1 hover:shadow-xl hover:border-indigo-300 hover:bg-white' : ''}
                                            ${isLocked ? 'cursor-not-allowed opacity-60' : ''}
                                        `}
                                    >
                                        <div className="flex items-center gap-1">
                                            {icon}
                                        </div>
                                        {content}
                                    </button>
                                );
                            })}
                            
                            {/* Base Decoration */}
                            <div className="absolute bottom-0 w-full h-12 bg-gradient-to-t from-slate-200 to-transparent border-t border-slate-200"></div>
                        </div>
                    </main>

                    {/* --- Modals --- */}

                    {/* Intro Modal */}
                    {modalState === 'intro' && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden animate-in zoom-in-95 duration-300 modal-scroll border-4 border-white/50 my-auto">
                                <div className="bg-gradient-to-r from-indigo-500 to-purple-600 p-8 text-center relative overflow-hidden">
                                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-20"></div>
                                    <BrickWall className="w-20 h-20 text-white mx-auto mb-4 relative z-10 drop-shadow-md animate-bounce" />
                                    <h2 className="text-3xl font-black text-white relative z-10 tracking-tight">建造守護之牆</h2>
                                </div>
                                <div className="p-8 bg-white">
                                    <CartoonCoverArt />
                                    <p className="text-slate-600 mb-6 text-center leading-relaxed font-medium">
                                        霸凌像是一場風暴。請在 <span className="font-bold text-red-500 bg-red-50 px-2 py-0.5 rounded-full border border-red-100">3 分鐘</span> 內，回答正確問題，一磚一瓦砌起堅固的城牆，保護我們的校園！
                                        <br/><span className="text-xs text-slate-400 mt-2 block">🔊 請確保音效開啟以獲得最佳體驗。</span>
                                    </p>
                                    <div className="flex gap-3 mb-8">
                                        <button onClick={handleTestAudio} className={`flex-1 font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 active:scale-95 shadow-sm border-2 ${isPlayingTest ? 'bg-yellow-100 border-yellow-300 text-yellow-700' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-600'}`}>
                                            {isPlayingTest ? <Volume2 className="w-5 h-5 animate-pulse" /> : <PlayCircle className="w-5 h-5" />}
                                            {isPlayingTest ? '播放中...' : '測試音效'}
                                        </button>
                                        <button onClick={startGame} className="flex-[2] bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 text-lg">
                                            <Hammer className="w-5 h-5 text-yellow-300 fill-yellow-300" />
                                            開始建造
                                        </button>
                                    </div>
                                    
                                    <div className="border-t border-slate-100 pt-6">
                                        <p className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider text-center flex items-center justify-center gap-2">
                                            <Trophy className="w-3 h-3" /> 最佳建造者
                                        </p>
                                        <div className="bg-slate-50 rounded-xl p-2 max-h-32 overflow-y-auto modal-scroll">
                                            {highScores.length === 0 ? <div className="text-xs text-center text-slate-400 py-2 italic">還沒有紀錄，快來當第一名！</div> : highScores.slice(0, 3).map((s, i) => (
                                            <div key={i} className="flex justify-between items-center text-xs text-slate-600 py-2 px-3 border-b border-slate-100 last:border-0 hover:bg-white rounded-lg transition-colors">
                                                <span className="flex items-center gap-2">
                                                    <span className={`w-4 h-4 flex items-center justify-center rounded-full text-[10px] text-white font-bold ${i===0?'bg-yellow-400':i===1?'bg-slate-400':'bg-orange-400'}`}>{i+1}</span>
                                                    {s.name}
                                                </span>
                                                <span className="font-mono font-bold text-indigo-500">{s.score}分</span>
                                            </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Question Modal */}
                    {modalState === 'question' && currentLand && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-0 overflow-hidden animate-in slide-in-from-bottom-8 duration-300 border-4 border-white/50 my-auto">
                                <div className="h-2 bg-slate-100 w-full">
                                    <div className="h-full bg-indigo-500 transition-all duration-1000 ease-linear shadow-[0_0_10px_rgba(99,102,241,0.5)]" style={{ width: `${(timeLeft / GAME_DURATION) * 100}%` }}></div>
                                </div>
                                <div className="p-8 bg-white">
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-100">
                                            BRICK #{currentLand.id}
                                        </span>
                                        <div className="flex items-center gap-3">
                                            <button onClick={isSpeaking ? cancelSpeech : handleSpeakQuestion} className={`flex items-center gap-1 text-xs px-3 py-1.5 rounded-full border transition-all ${isSpeaking ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'text-slate-500 border-slate-200 hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50'}`} title="朗讀題目">
                                                {isSpeaking ? <StopCircle className="w-3 h-3 animate-pulse"/> : <Mic className="w-3 h-3"/>}
                                                {isSpeaking ? '停止朗讀' : '念給你聽'}
                                            </button>
                                            <div className="text-xs font-bold text-slate-400 flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-full"><Clock className="w-3 h-3"/> {formatTime(timeLeft)}</div>
                                        </div>
                                    </div>
                                    <h3 className="text-xl md:text-2xl font-bold mb-8 text-slate-800 leading-snug tracking-tight">{currentLand.questionData.question}</h3>
                                    <div className="space-y-3">
                                        {currentLand.questionData.options.map((option, idx) => {
                                            let optionClass = "border-slate-200 bg-slate-50 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 hover:shadow-md";
                                            if (selectedOption === option) optionClass = "border-indigo-600 bg-indigo-600 text-white shadow-lg ring-2 ring-indigo-200 ring-offset-2";
                                            return (
                                                <button key={idx} onClick={() => !selectedOption && handleAnswer(option)} disabled={!!selectedOption} className={`w-full text-left p-5 rounded-2xl border-2 transition-all font-medium text-base md:text-lg ${optionClass} ${!selectedOption ? 'active:scale-[0.98]' : ''}`}>
                                                    <div className="flex items-start gap-3">
                                                        <div className={`mt-1 w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-colors ${selectedOption === option ? 'border-white bg-white' : 'border-slate-300'}`}>
                                                            {selectedOption === option && <div className="w-2.5 h-2.5 bg-indigo-600 rounded-full" />}
                                                        </div>
                                                        {option.text}
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Result Modal */}
                    {modalState === 'result' && resultData && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className={`bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center border-t-8 animate-in zoom-in-95 duration-200 ${resultData.isCorrect ? 'border-emerald-500' : 'border-red-500'} my-auto`}>
                                <div className="mb-6 flex justify-center relative">
                                    {resultData.isCorrect ? (
                                        <div className="relative"><div className="absolute inset-0 bg-emerald-100 rounded-full blur-2xl opacity-50 animate-pulse"></div><BrickWall className="w-24 h-24 text-emerald-500 relative z-10 drop-shadow-md animate-bounce-in" /></div>
                                    ) : (
                                        <div className="relative"><div className="absolute inset-0 bg-red-100 rounded-full blur-2xl opacity-50"></div><AlertTriangle className="w-24 h-24 text-red-500 relative z-10 drop-shadow-md animate-bounce-in" /></div>
                                    )}
                                </div>
                                <h3 className={`text-3xl font-black mb-2 tracking-tight ${resultData.isCorrect ? 'text-emerald-600' : 'text-red-600'}`}>{resultData.isCorrect ? '城牆建造成功！' : '防禦出現漏洞'}</h3>
                                <div className="bg-slate-50 p-6 rounded-2xl text-left my-6 border border-slate-100 shadow-inner">
                                    <span className="font-bold block mb-3 text-slate-800 text-sm uppercase tracking-wider flex items-center gap-2"><Star className="w-4 h-4 text-yellow-500 fill-yellow-500"/> 專家解析</span>
                                    <p className="text-slate-600 text-base leading-relaxed">{resultData.rationale}</p>
                                </div>
                                <button onClick={closeResult} className={`w-full py-4 rounded-2xl font-bold text-white text-lg transition-all shadow-lg transform hover:scale-[1.02] ${resultData.isCorrect ? 'bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 shadow-emerald-200' : 'bg-slate-700 hover:bg-slate-800 shadow-slate-300'}`}>
                                    {resultData.isCorrect ? '繼續建造' : '我知道了'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Victory / Game Over Modal */}
                    {(modalState === 'victory' || modalState === 'gameover') && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-10 text-center animate-bounce-in my-8 relative overflow-hidden border-4 border-white/20">
                                {modalState === 'victory' && (
                                    <>
                                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 pointer-events-none"></div>
                                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-300 via-orange-300 to-pink-300"></div>
                                    </>
                                )}
                                
                                {modalState === 'victory' ? (
                                    <>
                                        <div className="inline-block p-6 bg-yellow-50 rounded-full mb-6 shadow-xl shadow-yellow-100 ring-8 ring-yellow-50/50">
                                            <Shield className="w-20 h-20 text-yellow-500 drop-shadow-md animate-pulse-slow" />
                                        </div>
                                        <h2 className="text-4xl font-black text-slate-800 mb-2 tracking-tight">守護之盾已完成！</h2>
                                        <p className="text-slate-500 mb-8 font-medium text-lg">你成功建造了堅固的城牆，霸凌再也無法入侵！</p>
                                    </>
                                ) : (
                                    <>
                                        <div className="inline-block p-6 bg-red-50 rounded-full mb-6 shadow-xl shadow-red-100 ring-8 ring-red-50/50">
                                            <AlertTriangle className="w-20 h-20 text-red-500 drop-shadow-md" />
                                        </div>
                                        <h2 className="text-3xl font-black text-slate-800 mb-2">{resultData?.gameOverReason === 'timeout' ? "時間耗盡！" : "行動力耗盡！"}</h2>
                                        <p className="text-slate-500 mb-8 font-medium">別灰心，修復城牆需要不斷練習。再試一次吧！</p>
                                    </>
                                )}
                                
                                <div className="flex justify-center gap-4 mb-8">
                                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 w-1/2 shadow-sm">
                                        <div className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">最終得分</div>
                                        <div className="text-5xl font-black text-indigo-600">{playerStats.score}</div>
                                    </div>
                                    {modalState === 'victory' && (
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 w-1/2 shadow-sm">
                                            <div className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">剩餘時間</div>
                                            <div className="text-5xl font-black text-emerald-500">{formatTime(timeLeft)}</div>
                                        </div>
                                    )}
                                </div>

                                {!isScoreSaved ? (
                                    <div className="mb-8">
                                        <label className="block text-left text-sm font-bold text-slate-700 mb-2 ml-1">登記你的大名</label>
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="請輸入名字..." value={playerName} onChange={(e) => setPlayerName(e.target.value)} className="flex-1 bg-slate-50 border-2 border-slate-200 rounded-2xl px-5 py-4 focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors font-medium text-lg" maxLength={10} />
                                            <button onClick={saveScore} disabled={!playerName.trim()} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold px-8 py-4 rounded-2xl transition-all shadow-lg transform active:scale-95">登記</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="mb-8 bg-emerald-50 border border-emerald-200 text-emerald-700 p-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm"><CheckCircle className="w-5 h-5"/> 成績已儲存</div>
                                )}

                                {/* Leaderboard List */}
                                <div className="mt-6 w-full bg-white border border-slate-100 p-6 rounded-2xl text-left shadow-lg">
                                    <h4 className="flex items-center gap-2 font-bold text-slate-700 mb-4 border-b border-slate-100 pb-3">
                                        <ListIcon className="w-5 h-5 text-indigo-500" /> 
                                        榮譽榜 (TOP 5)
                                    </h4>
                                    {highScores.length === 0 ? (
                                        <p className="text-sm text-slate-400 text-center py-4 italic">尚無紀錄，成為第一位守護者吧！</p>
                                    ) : (
                                        <ul className="space-y-2">
                                            {highScores.map((entry, idx) => (
                                                <li key={idx} className="flex justify-between items-center text-slate-600 bg-slate-50 p-3 rounded-xl hover:bg-indigo-50 transition-colors">
                                                    <span className="flex items-center gap-3">
                                                        <span className={`w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold shadow-sm text-white ${idx === 0 ? 'bg-yellow-400' : idx === 1 ? 'bg-slate-400' : idx === 2 ? 'bg-orange-400' : 'bg-slate-200 !text-slate-500'}`}>{idx + 1}</span>
                                                        <span className="font-bold">{entry.name}</span>
                                                    </span>
                                                    <div className="flex items-center gap-3 text-sm">
                                                        <span className="text-slate-400 font-mono text-xs">{formatTime(entry.timeRemaining)}</span>
                                                        <span className="font-black text-indigo-600">{entry.score}</span>
                                                    </div>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>

                                <button onClick={() => initGame(false)} className="w-full mt-8 bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-all hover:shadow-xl hover:-translate-y-1">
                                    <RefreshCw className="w-5 h-5" />
                                    重新挑戰
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AntiBullyingGame />);
    </script>
</body>
</html>
