<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>採購證照測驗練習系統</title>
    <!-- 引入 Tailwind CSS 進行排版與設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 基礎字體設定與平滑滾動 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-font-smoothing: antialiased; }
        .transform-hover:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="app" class="p-4">
        <!-- 應用程式的內容會透過 JavaScript 動態渲染在這裡 -->
    </div>

    <script>
        // ==========================================
        // 1. 題庫資料區 (您可以依據此格式繼續擴充題目)
        // ==========================================
        const quizData = {
            "法規課程": {
                "政府採購法規概要": [
                    {
                        id: "law-1",
                        type: "tf",

                        answer: "X",

                    },
                    {
                        id: "law-2",
                        type: "mc",
                        question: "依政府採購法規定，機關辦理採購，得依實際需要，規定投標廠商之基本資格。下列何者非屬限制競爭之不當規定？",
                        options: ["A. 規定特定之商標或廠牌", "B. 規定須具有特定公會之會員資格 (依法令規定須具備者除外)", "C. 規定投標廠商須提出設立或登記證明", "D. 規定特定地區之廠商始得投標"],
                        answer: "C",
                        explanation: "C為正解。依採購法第36條及投標廠商資格與特殊或巨額採購認定標準，機關得規定廠商提出設立或登記證明作為基本資格。A、B、D皆屬不當限制競爭之違反法規態樣。"
                    },
                    {
                        id: "law-3",
                        type: "mc",
                        question: "某公務機關依採購法第105條第1項第3款及「特別採購招標決標處理辦法」向其他公務機關取得財物或勞務，得不適用以下何者關於採購法之規定？",
                        options: ["A. 第61條 決標公告", "B. 第13條 監辦", "C. 第53條 超底價8%以內決標", "D. 第98條 繳納代金"],
                        answer: "C",
                        explanation: "C為正解。依採購法第105條第1項第3款，雙方直屬上級機關核准者，得不適用第2章(招標)及第3章(決標)之規定。第53條屬決標章，故得不適用。"
                    },
                    {
                        id: "law-4",
                        type: "mc",
                        question: "機關依採購法第105條第1項第2款辦理公告金額以上之SARS防疫衛材緊急採購，下列敘述何者錯誤？",
                        options: ["A. 得奉准不適用採購法第53條規定，超底價10%決標。", "B. 應適用採購法第61條規定辦理決標公告。", "C. 得利用防疫衛材共同供應契約辦理訂貨，不另辦理招標。", "D. 得奉准不辦理驗收，緊急供應醫療人員使用。"],
                        answer: "D",
                        explanation: "D為正解(為錯誤敘述)。緊急採購雖可簡化招標決標程序，但仍應辦理驗收(得依第71條等規定採書面或簡化方式)，以確保物資符合需求，不得完全免除驗收程序。"
                    },
                    {
                        id: "law-5",
                        type: "tf",
                        question: "機關辦理工程採購，其預算金額達一定金額以上者，應於決標後將得標廠商之單價資料傳輸至工程會建立之工程價格資料庫。",
                        answer: "O",
                        explanation: "正確。依政府採購法第11條第2項規定，機關辦理工程採購預算達一定金額以上，應於決標後將單價資料傳輸至工程價格資料庫，供未來預算編列及底價訂定之參考。"
                    },
                    {
                        id: "law-6",
                        type: "tf",
                        question: "設立採購稽核小組之部會署及所屬機關以外之中央各機關所辦理之採購，若發生重大異常情形，應由中央採購稽核小組負責稽核監督。",
                        answer: "O",
                        explanation: "正確。依「採購稽核小組作業規則」與組織權責，未設採購稽核小組之中央機關所辦採購，或地方機關辦理採購有重大異常者，皆屬中央採購稽核小組之稽核範圍。"
                    },
                    {
                        id: "law-7",
                        type: "mc",
                        question: "關於政府採購法之適用對象，下列何者不適用本法？",
                        options: ["A. 公立學校辦理之採購", "B. 公營事業辦理之採購", "C. 政府機關補助民間團體辦理採購，補助金額占採購金額半數以上，且達公告金額以上者", "D. 私立學校運用自籌款辦理之採購"],
                        answer: "D",
                        explanation: "D為正解。政府機關、公立學校、公營事業適用本法(第3條)；接受機關補助辦理採購補助過半且達公告金額者亦適用(第4條)。私立學校以自籌款辦理採購不適用採購法。"
                    },
                    {
                        id: "law-8",
                        type: "tf",
                        question: "機關辦理採購，除我國締結之條約或協定另有規定者外，得不允許大陸地區廠商參與。",
                        answer: "O",
                        explanation: "正確。依政府採購法第17條及相關函釋，除條約或協定另有規定，或機關基於特殊需要經核准外，原則上得不允許大陸地區廠商或其產品參與我國政府採購。"
                    }
                ]
            },
            "實務課程": {
                "工程及技術服務採購實務": [
                    {
                        id: "eng-1",
                        type: "tf",
                        question: "機關將「專案管理」與「施工監造」分別委由兩個不同廠商辦理時，專案管理廠商不可同時為該工程之統包廠商。",
                        answer: "O",
                        explanation: "正確。基於利益迴避與監督機制，專案管理廠商負責協助機關監督設計及施工，若同時身為施工(統包)廠商，將球員兼裁判，違反採購公平與履約品質管理原則。"
                    }
                ],
                "財物及勞務採購實務": [
                    {
                        id: "prop-1",
                        type: "tf",
                        question: "機關辦理勞務採購，其性質為委任或僱傭，不得以承攬方式辦理。",
                        answer: "X",
                        explanation: "錯誤。依政府採購法第7條第3項，勞務採購包含專業服務、技術服務、資訊服務、研究發展、營運管理、維修、訓練、勞力及其他經主管機關認定之勞務。實務上勞務採購亦常以委任或承攬方式辦理，非僅限委任或僱傭。"
                    },
                    {
                        id: "prop-2",
                        type: "mc",
                        question: "下列何者為財物採購常見之決標原則？",
                        options: ["A. 僅能採最低標", "B. 最低標及最有利標皆可適用", "C. 僅能採最有利標", "D. 僅能依最有利標精神"],
                        answer: "B",
                        explanation: "B為正解。依採購法第52條，機關辦理採購之決標原則，包含最低標及最有利標等，財物採購依個案特性兩者皆可適用。"
                    }
                ],
                "最有利標及評選優勝廠商": [
                    {
                        id: "best-1",
                        type: "mc",
                        question: "依最有利標評選辦法，評定最有利標之方式，不包含下列何者？",
                        options: ["A. 總評分法", "B. 評分單價法", "C. 序位法", "D. 最低標決標法"],
                        answer: "D",
                        explanation: "D為正解。依最有利標評選辦法，評定最有利標方式包括：總評分法、評分單價法、序位法。最低標決標屬於另一種決標原則，非最有利標之評定方式。"
                    },
                    {
                        id: "best-2",
                        type: "tf",
                        question: "評選委員會委員名單於公開前應予保密；未公開者，於開始評選前亦應保密。",
                        answer: "O",
                        explanation: "正確。依採購評選委員會組織準則第6條規定，委員名單於公開前應保密，以免遭受外界不當干擾或請託關說。"
                    }
                ],
                "電子採購實務": [
                    {
                        id: "elec-1",
                        type: "tf",
                        question: "機關允許廠商以電子化方式辦理領標者，應於招標公告及招標文件中規定，廠商未附領標電子憑據者，一律直接視為不合格標，不得要求補正。",
                        answer: "X",
                        explanation: "錯誤。依電子採購作業辦法，未檢附領標電子憑據者，依採購法第50條規定辦理，實務上通常會給予廠商提出說明的機會，或查核系統確認其確有領標紀錄，非一律不給予說明機會即判不合格。"
                    }
                ]
            },
            "其他課程": {
                "錯誤採購態樣": [
                    {
                        id: "err-1",
                        type: "mc",
                        question: "下列何者屬於準備招標文件階段之錯誤行為態樣？",
                        options: ["A. 擅改法律文字，如更改採購法第101條文字", "B. 開標前洩漏底價", "C. 未依規定組成採購評選委員會", "D. 驗收紀錄記載不實"],
                        answer: "A",
                        explanation: "A為正解。「擅改法律文字」屬於準備招標文件階段之錯誤態樣。B屬招標決標階段違法；C屬評選階段錯誤；D屬驗收階段錯誤。"
                    }
                ],
                "投標須知及招標文件製作": [
                    {
                        id: "doc-1",
                        type: "tf",
                        question: "機關辦理招標，其招標文件內容應包括投標廠商提交投標書所需之一切必要資料，例如投標須知、契約條款等。",
                        answer: "O",
                        explanation: "正確。依採購法第29條第3項規定，招標文件內容應包括投標廠商提交投標書所需之一切必要資料，以利廠商評估及投標。"
                    },
                    {
                        id: "doc-2",
                        type: "mc",
                        question: "下列何者不屬於政府採購法主管機關訂定之投標須知範本？",
                        options: ["A. 投標須知範本", "B. 參考最有利標精神投標須知範本", "C. 公開取得電子報價單投標須知範本", "D. 限制性招標專用投標須知範本"],
                        answer: "D",
                        explanation: "D為正解。主管機關訂定之3種投標須知範本為：投標須知範本、參考最有利標精神投標須知範本、公開取得電子報價單投標須知範本。"
                    }
                ],
                "採購契約": [
                    {
                        id: "contract-1",
                        type: "tf",
                        question: "各類採購契約以採用主管機關訂定之範本為原則，其要項及內容由主管機關參考國際及國內慣例定之。",
                        answer: "O",
                        explanation: "正確。依政府採購法第63條第1項規定，為避免個案採購契約不完整或未符公平合理，明定以採用主管機關訂定之契約範本為原則。"
                    },
                    {
                        id: "contract-2",
                        type: "mc",
                        question: "履約標的涉及共通性應用程式介面(API)開發或整合者，應依下列哪一個機關訂定之指引辦理？",
                        options: ["A. 國家發展委員會", "B. 數位發展部", "C. 行政院公共工程委員會", "D. 經濟部"],
                        answer: "B",
                        explanation: "B為正解。依採購契約範本規定，履約標的涉及共通性應用程式介面開發或整合者，應依數位發展部訂定之「共通性應用程式介面指引」辦理。"
                    }
                ],
                "底價及價格分析": [
                    {
                        id: "price-1",
                        type: "tf",
                        question: "在成本分析中，「直接成本」是指不易分辨其歸屬於特定工作，而須與他案分攤之費用，例如設備折舊。",
                        answer: "X",
                        explanation: "錯誤。直接成本是指「為執行特定工作所發生之費用，例如原料」。不易分辨須分攤者（如設備折舊）稱為「間接成本」。"
                    }
                ],
                "爭議處理": [
                    {
                        id: "dispute-1",
                        type: "tf",
                        question: "工程採購經採購申訴審議委員會提出調解建議或調解方案，因機關不同意致調解不成立者，廠商提付仲裁，機關不得拒絕。",
                        answer: "O",
                        explanation: "正確。依採購法第85條之1規定，工程及技術服務採購之調解，因機關不同意致調解不成立者，廠商提付仲裁，機關不得拒絕。"
                    },
                    {
                        id: "dispute-2",
                        type: "mc",
                        question: "廠商對於機關依採購法第101條將刊登政府採購公報之通知不服者，得於接獲通知之次日起幾日內，以書面向機關提出異議？",
                        options: ["A. 10日", "B. 15日", "C. 20日", "D. 30日"],
                        answer: "C",
                        explanation: "C為正解。依採購法第102條規定，廠商對於第101條之通知，得於接獲通知之次日起20日內，以書面向該機關提出異議。"
                    }
                ],
                "道德規範及違法處置": [
                    {
                        id: "ethic-1",
                        type: "mc",
                        question: "依採購法第15條第1項規定，機關承辦、監辦採購人員於離職後幾年內，不得為本人或代理廠商向原任職機關接洽處理離職前幾年內與職務有關之事務？ (即旋轉門條款)",
                        options: ["A. 離職後1年內；離職前3年內", "B. 離職後3年內；離職前5年內", "C. 離職後2年內；離職前2年內", "D. 離職後5年內；離職前3年內"],
                        answer: "B",
                        explanation: "B為正解。採購法第15條規定：「機關承辦、監辦採購人員於離職後3年內不得為本人或代理廠商向原任職機關接洽處理離職前5年內與職務有關之事務」。"
                    }
                ]
            }
        };

        // --- 自動擴充題庫腳本 ---
        // 自動檢測並補足不足的模擬題目，實際使用時只需在上方擴充真實題目即可。
        Object.keys(quizData).forEach(mainCat => {
            Object.keys(quizData[mainCat]).forEach(subCat => {
                let tfCount = quizData[mainCat][subCat].filter(q => q.type === 'tf').length;
                let mcCount = quizData[mainCat][subCat].filter(q => q.type === 'mc').length;

                for (let i = tfCount; i < 15; i++) {
                    quizData[mainCat][subCat].push({
                        id: `sim-${mainCat}-${subCat}-tf-${i}`,
                        type: "tf",
                        question: `[模擬題庫] ${subCat} - 是非題第 ${i + 1} 題：這是一道為了滿足30題隨機抽題機制所自動產生的模擬題目。`,
                        answer: i % 2 === 0 ? "O" : "X",
                        explanation: "此為模擬擴充題庫解析。請於實作時在原始碼的 quizData 中補入足夠的真實考題。"
                    });
                }

                for (let i = mcCount; i < 25; i++) {
                    quizData[mainCat][subCat].push({
                        id: `sim-${mainCat}-${subCat}-mc-${i}`,
                        type: "mc",
                        question: `[模擬題庫] ${subCat} - 選擇題第 ${i + 1} 題：這是一道為了滿足30題隨機抽題機制所自動產生的模擬題目。`,
                        options: ["A. 模擬選項甲", "B. 模擬選項乙", "C. 模擬選項丙", "D. 模擬選項丁"],
                        answer: "A",
                        explanation: "此為模擬擴充題庫解析。請於實作時在原始碼的 quizData 中補入足夠的真實考題。"
                    });
                }
            });
        });

        // ==========================================
        // 2. 狀態管理與系統邏輯
        // ==========================================
        const MAIN_CATEGORIES = Object.keys(quizData);
        let currentView = 'menu'; // 'menu', 'subcategory', 'quiz', 'result', 'mistakes'
        let selectedMainCat = '';
        let selectedSubCat = '';
        let questions = [];
        let currentQIndex = 0;
        let userAnswers = {};
        let scoreInfo = { totalScore: 0, maxScore: 0 };
        let mistakesBook = [];

        // 重新渲染畫面
        function renderApp() {
            const app = document.getElementById('app');
            if (currentView === 'menu') app.innerHTML = renderMenu();
            else if (currentView === 'subcategory') app.innerHTML = renderSubCategory();
            else if (currentView === 'quiz') app.innerHTML = renderQuiz();
            else if (currentView === 'result') app.innerHTML = renderResult();
            else if (currentView === 'mistakes') app.innerHTML = renderMistakes();
            
            // 每次渲染後初始化 Lucide 圖示
            lucide.createIcons();
        }

        // 選擇主分類
        window.handleSelectMainCat = (cat) => {
            selectedMainCat = cat;
            currentView = 'subcategory';
            renderApp();
        };

        // 選擇子分類並開始測驗 (全面套用30題隨機機制)
        window.handleSelectSubCat = (subCat) => {
            selectedSubCat = subCat;
            let selectedQuestions = [...quizData[selectedMainCat][subCat]];
            
            if (selectedQuestions && selectedQuestions.length > 0) {
                // 隨機打亂
                let tfQuestions = selectedQuestions.filter(q => q.type === 'tf').sort(() => 0.5 - Math.random());
                let mcQuestions = selectedQuestions.filter(q => q.type === 'mc').sort(() => 0.5 - Math.random());
                
                // 擷取指定數量 (10是非, 20選擇)
                tfQuestions = tfQuestions.slice(0, 10);
                mcQuestions = mcQuestions.slice(0, 20);
                
                questions = [...tfQuestions, ...mcQuestions];
                currentQIndex = 0;
                userAnswers = {};
                currentView = 'quiz';
                renderApp();
            } else {
                alert("此單元目前尚無題庫，請選擇其他單元！");
            }
        };

        // 記錄使用者答案
        window.handleAnswerSelect = (answer) => {
            userAnswers[currentQIndex] = answer;
            renderApp();
        };

        // 下一題或交卷
        window.handleNext = () => {
            if (currentQIndex < questions.length - 1) {
                currentQIndex++;
                renderApp();
            } else {
                calculateScore();
                currentView = 'result';
                renderApp();
            }
        };

        // 上一題
        window.handlePrev = () => {
            if (currentQIndex > 0) {
                currentQIndex--;
                renderApp();
            }
        };

        // 計算分數與紀錄錯題
        function calculateScore() {
            let earned = 0;
            let max = 0;
            let newMistakes = [];
            
            questions.forEach((q, index) => {
                const points = q.type === 'tf' ? 1 : 2;
                max += points;
                if (userAnswers[index] === q.answer) {
                    earned += points;
                } else {
                    // 記錄答錯的題目
                    newMistakes.push({ ...q, userAnswer: userAnswers[index] });
                }
            });
            
            // 更新錯題本 (避免重複，保留最新錯誤答案)
            const combined = [...mistakesBook, ...newMistakes];
            const uniqueMap = new Map();
            combined.forEach(item => uniqueMap.set(item.id, item));
            mistakesBook = Array.from(uniqueMap.values());

            scoreInfo = { totalScore: earned, maxScore: max };
        }

        // 返回主選單
        window.returnToMenu = () => {
            currentView = 'menu';
            selectedMainCat = '';
            selectedSubCat = '';
            questions = [];
            renderApp();
        };

        // ==========================================
        // 3. 視圖渲染函數 (生成 HTML 字串)
        // ==========================================

        function renderMenu() {
            const icons = ['file-text', 'book-open', 'alert-triangle'];
            const colors = [
                "bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100", 
                "bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100", 
                "bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-100"
            ];

            const categoriesHtml = MAIN_CATEGORIES.map((cat, idx) => `
                <div onclick="handleSelectMainCat('${cat}')" class="cursor-pointer border-2 rounded-xl p-6 flex flex-col items-center justify-center transition-all duration-200 transform-hover ${colors[idx % 3]}">
                    <div class="mb-4 p-4 bg-white rounded-full shadow-sm">
                        <i data-lucide="${icons[idx % 3]}" class="w-8 h-8"></i>
                    </div>
                    <h2 class="text-xl font-bold mb-2">${cat}</h2>
                    <span class="text-sm opacity-80 flex items-center">
                        開始測驗 <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>
                    </span>
                </div>
            `).join('');

            return `
                <div class="max-w-4xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
                    <div class="text-center mb-10">
                        <h1 class="text-3xl font-bold text-slate-800 mb-2">採購人員證照 模擬測驗系統</h1>
                        <p class="text-slate-500">請選擇您要複習的課目</p>
                    </div>
                    <div class="grid md:grid-cols-3 gap-6">
                        ${categoriesHtml}
                    </div>
                    <div class="mt-8 p-4 bg-slate-50 rounded-lg text-sm text-slate-600 border border-slate-200">
                        <p class="font-semibold mb-1">📝 測驗說明：</p>
                        <ul class="list-disc pl-5 space-y-1">
                            <li>本系統依照採購證照考試規範設計。</li>
                            <li><strong>配分機制</strong>：是非題每題 1 分，選擇題每題 2 分。</li>
                            <li><strong>所有單元</strong>：每次測驗皆會從題庫中隨機打亂抽取 <strong>30 題 (是非 10 題、選擇 20 題)</strong>。</li>
                            <li>測驗完成後將提供錯題詳細解析，並自動收錄至「錯題本」。</li>
                        </ul>
                    </div>
                    <div class="mt-6 flex justify-center">
                        <button onclick="currentView = 'mistakes'; renderApp();" class="flex items-center px-6 py-3 bg-red-50 text-red-600 border border-red-200 font-bold rounded-lg hover:bg-red-100 transition-colors shadow-sm transform-hover">
                            <i data-lucide="book-x" class="w-5 h-5 mr-2"></i> 前往我的錯題本 (目前累積 ${mistakesBook.length} 題)
                        </button>
                    </div>
                </div>
            `;
        }

        function renderSubCategory() {
            const subcats = Object.keys(quizData[selectedMainCat]);
            const listHtml = subcats.map(subCat => `
                <div onclick="handleSelectSubCat('${subCat}')" class="flex justify-between items-center p-4 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition-all group">
                    <span class="font-medium text-slate-700 group-hover:text-blue-700">${subCat}</span>
                    <div class="flex items-center text-sm text-slate-400 group-hover:text-blue-500">
                        題庫總數: ${quizData[selectedMainCat][subCat].length} 題
                        <i data-lucide="chevron-right" class="w-4 h-4 ml-2"></i>
                    </div>
                </div>
            `).join('');

            return `
                <div class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
                    <button onclick="returnToMenu()" class="flex items-center text-slate-500 hover:text-blue-600 mb-6 transition-colors">
                        <i data-lucide="home" class="w-4 h-4 mr-1"></i> 回主選單
                    </button>
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-4">
                        ${selectedMainCat} - 單元選擇
                    </h2>
                    <div class="space-y-3">
                        ${listHtml}
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            const q = questions[currentQIndex];
            const isAnswered = userAnswers[currentQIndex] !== undefined;
            const isLastQuestion = currentQIndex === questions.length - 1;
            
            let optionsHtml = '';
            
            if (q.type === 'tf') {
                const oClass = userAnswers[currentQIndex] === 'O' ? 'bg-blue-100 border-blue-500 text-blue-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50';
                const xClass = userAnswers[currentQIndex] === 'X' ? 'bg-blue-100 border-blue-500 text-blue-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50';
                
                optionsHtml = `
                    <div class="flex space-x-4">
                        <button onclick="handleAnswerSelect('O')" class="flex-1 py-4 text-lg font-bold rounded-lg border-2 transition-all ${oClass}">O (正確)</button>
                        <button onclick="handleAnswerSelect('X')" class="flex-1 py-4 text-lg font-bold rounded-lg border-2 transition-all ${xClass}">X (錯誤)</button>
                    </div>
                `;
            } else {
                optionsHtml = q.options.map(opt => {
                    const optLetter = opt.charAt(0);
                    const isSelected = userAnswers[currentQIndex] === optLetter;
                    const bgClass = isSelected ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-slate-200 hover:bg-slate-50';
                    const iconClass = isSelected ? 'border-blue-500 bg-blue-500 text-white' : 'border-slate-300 text-transparent';
                    const iconHtml = isSelected ? '<i data-lucide="check-circle" class="w-4 h-4"></i>' : '';
                    
                    return `
                        <div onclick="handleAnswerSelect('${optLetter}')" class="p-4 rounded-lg border-2 cursor-pointer transition-all flex items-center ${bgClass}">
                            <div class="w-6 h-6 rounded-full border flex items-center justify-center mr-3 flex-shrink-0 ${iconClass}">
                                ${iconHtml}
                            </div>
                            <span class="text-base">${opt}</span>
                        </div>
                    `;
                }).join('');
            }

            return `
                <div class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg min-h-[400px] flex flex-col">
                    <div class="flex justify-between items-center mb-6 text-sm text-slate-500 font-medium">
                        <span class="bg-slate-100 px-3 py-1 rounded-full">${selectedSubCat}</span>
                        <span>題目 ${currentQIndex + 1} / ${questions.length}</span>
                    </div>

                    <div class="mb-8 flex-grow">
                        <div class="flex items-start mb-6">
                            <span class="inline-block px-2 py-1 rounded text-xs font-bold text-white mr-3 mt-1 whitespace-nowrap ${q.type === 'tf' ? 'bg-indigo-500' : 'bg-purple-500'}">
                                ${q.type === 'tf' ? '是非題 (1分)' : '選擇題 (2分)'}
                            </span>
                            <h3 class="text-xl font-semibold text-slate-800 leading-relaxed">${q.question}</h3>
                        </div>
                        <div class="space-y-3 pl-2">
                            ${optionsHtml}
                        </div>
                    </div>

                    <div class="flex justify-between pt-4 border-t border-slate-100">
                        <button onclick="handlePrev()" ${currentQIndex === 0 ? 'disabled' : ''} class="px-6 py-2 rounded-lg font-medium ${currentQIndex === 0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-600 hover:bg-slate-100'}">
                            上一題
                        </button>
                        <button onclick="handleNext()" ${!isAnswered ? 'disabled' : ''} class="px-8 py-2 rounded-lg font-bold transition-colors ${!isAnswered ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}">
                            ${isLastQuestion ? '交卷看成績' : '下一題'}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const percentage = Math.round((scoreInfo.totalScore / scoreInfo.maxScore) * 100);
            let feedback = "";
            let color = "";
            
            if (percentage >= 80) {
                feedback = "表現優異！觀念十分清晰。"; color = "text-emerald-500";
            } else if (percentage >= 60) {
                feedback = "基礎不錯，但請務必詳閱錯題解析，補足觀念。"; color = "text-amber-500";
            } else {
                feedback = "需要再多加把勁！建議重新複習講義後再次測驗。"; color = "text-red-500";
            }

            const answersHtml = questions.map((q, idx) => {
                const userAnswer = userAnswers[idx];
                const isCorrect = userAnswer === q.answer;
                const points = q.type === 'tf' ? 1 : 2;
                
                let mcOptionsHtml = '';
                if (!isCorrect && q.type === 'mc') {
                    mcOptionsHtml = `<div class="mb-3 text-sm text-slate-600">` + 
                        q.options.map(opt => `<div class="${opt.startsWith(q.answer) ? 'font-bold text-slate-900' : ''}">${opt}</div>`).join('') +
                        `</div>`;
                }

                let explanationHtml = !isCorrect ? `
                    <div class="mt-3 bg-white p-4 rounded border border-red-100 text-slate-700 text-sm leading-relaxed shadow-sm">
                        <span class="font-bold text-red-800 flex items-center mb-1">
                            <i data-lucide="book-open" class="w-4 h-4 mr-1"></i> 觀念解析：
                        </span>
                        ${q.explanation}
                    </div>
                ` : '';

                return `
                    <div class="p-5 rounded-lg border-l-4 ${isCorrect ? 'bg-emerald-50 border-emerald-500' : 'bg-red-50 border-red-500'}">
                        <div class="flex items-start">
                            <div class="mr-4 mt-1">
                                <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-6 h-6 ${isCorrect ? 'text-emerald-500' : 'text-red-500'}"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between">
                                    <p class="font-semibold text-slate-800 text-lg mb-2">${idx + 1}. ${q.question}</p>
                                    <span class="text-sm font-bold ml-4 whitespace-nowrap text-slate-500">
                                        得 ${isCorrect ? points : 0} 分
                                    </span>
                                </div>
                                ${mcOptionsHtml}
                                <div class="flex space-x-6 text-sm mb-3">
                                    <span class="text-slate-600">您的答案：<strong class="${isCorrect ? 'text-emerald-600' : 'text-red-600'}">${userAnswer || '未作答'}</strong></span>
                                    ${!isCorrect ? `<span class="text-slate-600">正確答案：<strong class="text-emerald-600">${q.answer}</strong></span>` : ''}
                                </div>
                                ${explanationHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="max-w-4xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
                    <div class="text-center mb-10 pb-8 border-b border-slate-200">
                        <h2 class="text-3xl font-bold text-slate-800 mb-4">測驗結果</h2>
                        <div class="flex justify-center items-end space-x-2 mb-2">
                            <span class="text-6xl font-black ${color}">${scoreInfo.totalScore}</span>
                            <span class="text-xl text-slate-500 font-medium mb-1">/ ${scoreInfo.maxScore} 分</span>
                        </div>
                        <p class="text-lg font-medium text-slate-600">${feedback}</p>
                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                        <i data-lucide="file-text" class="w-5 h-5 mr-2 text-blue-500"></i> 答題檢討 (錯題重點解析)
                    </h3>
                    <div class="space-y-6">
                        ${answersHtml}
                    </div>

                    <div class="mt-10 flex justify-center space-x-4">
                        <button onclick="handleSelectSubCat('${selectedSubCat}')" class="flex items-center px-6 py-3 bg-blue-100 text-blue-700 font-bold rounded-lg hover:bg-blue-200 transition-colors">
                            <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2"></i> 重新測驗本單元
                        </button>
                        <button onclick="returnToMenu()" class="flex items-center px-6 py-3 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-700 transition-colors">
                            <i data-lucide="home" class="w-4 h-4 mr-2"></i> 回主選單
                        </button>
                    </div>
                </div>
            `;
        }

        function renderMistakes() {
            let contentHtml = '';
            
            if (mistakesBook.length === 0) {
                contentHtml = `
                    <div class="text-center py-12 text-slate-500">
                        <i data-lucide="check-circle" class="w-14 h-14 mx-auto text-emerald-400 mb-4"></i>
                        <p class="text-xl font-medium">太棒了！目前沒有任何錯題紀錄。</p>
                        <p class="mt-2">繼續保持下去！</p>
                    </div>
                `;
            } else {
                const listHtml = mistakesBook.map((q, idx) => {
                    let mcOptionsHtml = '';
                    if (q.type === 'mc') {
                        mcOptionsHtml = `<div class="mb-3 text-sm text-slate-600 pl-2">` + 
                            q.options.map(opt => `<div class="${opt.startsWith(q.answer) ? 'font-bold text-slate-900' : ''}">${opt}</div>`).join('') +
                            `</div>`;
                    }
                    return `
                        <div class="p-5 rounded-lg border-l-4 bg-white shadow-sm border border-slate-200 border-l-red-400">
                            <div class="flex items-start">
                                <div class="mr-4 mt-1">
                                    <i data-lucide="x-circle" class="w-6 h-6 text-red-400"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="flex justify-between items-start mb-2">
                                        <p class="font-semibold text-slate-800 text-lg leading-relaxed">${idx + 1}. ${q.question}</p>
                                        <span class="text-xs font-bold ml-4 whitespace-nowrap text-white px-2 py-1 rounded bg-slate-400 mt-1">
                                            ${q.type === 'tf' ? '是非題' : '選擇題'}
                                        </span>
                                    </div>
                                    ${mcOptionsHtml}
                                    <div class="flex space-x-6 text-sm mb-4 pl-2">
                                        <span class="text-slate-600 bg-slate-50 px-2 py-1 rounded">您上次作答：<strong class="text-red-600">${q.userAnswer || '未作答'}</strong></span>
                                        <span class="text-slate-600 bg-emerald-50 px-2 py-1 rounded">正確答案：<strong class="text-emerald-600">${q.answer}</strong></span>
                                    </div>
                                    <div class="bg-blue-50 p-4 rounded border border-blue-100 text-slate-700 text-sm leading-relaxed">
                                        <span class="font-bold text-blue-800 flex items-center mb-1">
                                            <i data-lucide="book-open" class="w-4 h-4 mr-1"></i> 觀念解析：
                                        </span>
                                        ${q.explanation}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                contentHtml = `
                    <div class="space-y-6">
                        <div class="bg-red-50 p-4 rounded-lg text-sm text-red-700 mb-6 flex justify-between items-center border border-red-100">
                            <span class="font-medium text-base">目前共累積 ${mistakesBook.length} 題需要複習的錯題：</span>
                            <button onclick="if(confirm('確定要清空所有錯題紀錄嗎？此動作無法復原。')) { mistakesBook = []; renderApp(); }" class="px-4 py-2 bg-red-200 hover:bg-red-300 text-red-800 font-semibold rounded transition-colors">
                                清空錯題本
                            </button>
                        </div>
                        ${listHtml}
                    </div>
                `;
            }

            return `
                <div class="max-w-4xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
                    <div class="flex justify-between items-center mb-6 border-b pb-4">
                        <h2 class="text-2xl font-bold text-slate-800 flex items-center">
                            <i data-lucide="book-x" class="w-6 h-6 mr-2 text-red-500"></i> 我的錯題本
                        </h2>
                        <button onclick="returnToMenu()" class="flex items-center px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors">
                            <i data-lucide="home" class="w-4 h-4 mr-2"></i> 回主選單
                        </button>
                    </div>
                    ${contentHtml}
                </div>
            `;
        }

        // ==========================================
        // 初始化應用程式
        // ==========================================
        renderApp();
        
    </script>
</body>
</html>
