<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂互動點名加分系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .student-card { transition: all 0.2s ease-in-out; }
        .student-card.present { border-color: #22c55e; background-color: #f0fdf4; }
        .student-card.absent { border-color: #e5e7eb; background-color: #ffffff; opacity: 0.7; }
        .point-pop { animation: pop 0.3s ease-out forwards; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #eab308; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

<div class="container mx-auto p-4 md:p-6 max-w-6xl">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
        <h1 class="text-2xl font-bold text-indigo-700"><i class="fas fa-chalkboard-teacher mr-2"></i>課堂互動點名系統</h1>
        <div class="flex flex-wrap gap-3 mt-4 md:mt-0 items-center justify-center">
            <select id="classSelect" class="border p-2 rounded-lg bg-gray-50 text-sm md:text-base font-semibold outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">選擇/建立班級</option>
                <!-- 動態生成 -->
            </select>
            <button onclick="toggleImportModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition">
                <i class="fas fa-file-import mr-1"></i> 手動匯入
            </button>
            <button onclick="loadFromCloud()" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-md transition flex items-center">
                <i class="fas fa-cloud-download-alt mr-1"></i> 雲端下載
            </button>
            <button onclick="syncToCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-md transition flex items-center">
                <i class="fas fa-cloud-upload-alt mr-1"></i> 同步上傳
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div id="workspace" class="hidden">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
            <h2 id="currentClassTitle" class="text-xl font-bold text-gray-700"></h2>
            <div class="space-x-2 flex flex-wrap gap-y-2">
                <button onclick="showAddStudentModal()" class="text-sm bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1 rounded-full shadow-sm transition"><i class="fas fa-user-plus mr-1"></i>新增學生</button>
                <button onclick="markAllPresent()" class="text-sm bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1 rounded-full shadow-sm transition"><i class="fas fa-check-double mr-1"></i>全班出席</button>
                <button onclick="resetPoints()" class="text-sm bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded-full shadow-sm transition"><i class="fas fa-undo mr-1"></i>本堂歸零</button>
            </div>
        </div>

        <!-- Progress Tracking Section (NEW) -->
        <div class="mb-5 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-100">
                <label class="block text-sm font-bold text-blue-800 mb-2">
                    <i class="fas fa-history mr-2"></i>上週學習任務/進度 (雲端下載)
                </label>
                <div id="lastWeekProgressDisplay" class="text-sm text-gray-700 min-h-[3rem] p-3 bg-white rounded-lg border border-blue-200 whitespace-pre-line">
                    尚無資料，請點擊上方「雲端下載」取得最新紀錄。
                </div>
            </div>
            <div class="bg-green-50 p-4 rounded-xl shadow-sm border border-green-100">
                <label class="block text-sm font-bold text-green-800 mb-2">
                    <i class="fas fa-edit mr-2"></i>本週學習進度 (將同步上傳)
                </label>
                <textarea id="thisWeekProgressInput" rows="2" class="w-full border border-green-200 p-3 rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none bg-white" placeholder="請輸入本週預定或實際完成的教學進度... (例如：完成第三單元實驗操作)"></textarea>
            </div>
        </div>

        <!-- Class Note Section -->
        <div class="mb-5 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <label class="block text-sm font-bold text-gray-700 mb-2">
                <i class="fas fa-book-open text-indigo-500 mr-2"></i>單堂整體學習內容與表現紀錄
            </label>
            <textarea id="classNoteInput" rows="2" class="w-full border p-3 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50" placeholder="例如：今日全班討論熱烈，但小組發言常規需加強... (此紀錄將隨分數一同上傳至「歷史日誌表」中)"></textarea>
        </div>

        <!-- Student Grid -->
        <div id="studentGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <!-- 學生卡片由 JS 動態生成 -->
        </div>
    </div>

    <div id="emptyState" class="text-center py-20 bg-white rounded-xl shadow-sm border border-dashed border-gray-300">
        <i class="fas fa-users text-gray-300 text-6xl mb-4"></i>
        <h3 class="text-lg font-medium text-gray-500">請先選擇班級、手動匯入或從雲端下載名單</h3>
    </div>

</div>

<!-- Import Modal -->
<div id="importModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-40">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-lg">
        <h2 class="text-xl font-bold mb-4">手動匯入班級名單</h2>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">班級名稱</label>
            <input type="text" id="importClassName" class="w-full border p-2 rounded-lg mb-3" placeholder="例如：六年一班">
            <label class="block text-sm font-medium text-gray-700 mb-1">貼上名單 (座號,姓名 - 每行一位，可留空)</label>
            <textarea id="importData" rows="6" class="w-full border p-2 rounded-lg font-mono text-sm" placeholder="1,王小明&#10;2,陳小華&#10;3,林小美"></textarea>
            <p class="text-xs text-gray-500 mt-1">支援從 Excel 複製貼上，容許全形(，)、半形(,)與空白分隔。</p>
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="toggleImportModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
            <button onclick="processImport()" class="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg">儲存並建立</button>
        </div>
    </div>
</div>

<!-- GAS URL Setup Modal -->
<div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-40">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-lg">
        <h2 class="text-xl font-bold mb-4">系統設定</h2>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Google Apps Script Web App URL</label>
            <input type="text" id="gasUrlInput" class="w-full border p-2 rounded-lg" placeholder="https://script.google.com/macros/s/...">
            <p class="text-xs text-gray-500 mt-1">請填入您部署的 GAS 網址，才能進行雲端下載與同步上傳。</p>
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="closeSettingsModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">稍後設定</button>
            <button onclick="saveSettings()" class="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg">儲存設定</button>
        </div>
    </div>
</div>

<!-- Add Student Custom Modal -->
<div id="addStudentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-40">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm">
        <h2 class="text-lg font-bold mb-4 text-gray-800"><i class="fas fa-user-plus text-indigo-500 mr-2"></i>新增學生</h2>
        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">學生座號</label>
            <input type="text" id="newStudentId" class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
        </div>
        <div class="mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-1">學生姓名</label>
            <input type="text" id="newStudentName" class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="closeAddStudentModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm">取消</button>
            <button onclick="submitNewStudent()" class="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg text-sm font-medium">確認新增</button>
        </div>
    </div>
</div>

<!-- Custom Confirm Modal -->
<div id="customConfirmModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm">
        <h2 class="text-lg font-bold mb-2 text-gray-800"><i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>系統確認</h2>
        <p id="confirmMessage" class="text-gray-600 mb-6 text-sm whitespace-pre-line"></p>
        <div class="flex justify-end gap-2">
            <button onclick="closeConfirmModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm">取消</button>
            <button id="confirmBtn" class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded-lg text-sm font-medium">確定執行</button>
        </div>
    </div>
</div>

<!-- Custom Alert Modal -->
<div id="customAlertModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm">
        <h2 class="text-lg font-bold mb-2 text-gray-800"><i class="fas fa-info-circle text-blue-500 mr-2"></i>系統提示</h2>
        <p id="alertMessage" class="text-gray-600 mb-6 text-sm whitespace-pre-line"></p>
        <div class="flex justify-end">
            <button onclick="closeAlertModal()" class="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg text-sm font-medium">了解</button>
        </div>
    </div>
</div>

<script>
    // 系統狀態
    let appData = JSON.parse(localStorage.getItem('classData')) || {};
    let currentClass = '';
    let gasUrl = localStorage.getItem('gasUrl') || '';

    // --- 資料結構相容性遷移與升級 (包含舊版升級為新版結構) ---
    Object.keys(appData).forEach(cls => {
        // 如果舊資料直接是陣列，轉換為新版物件結構
        if (Array.isArray(appData[cls])) {
            appData[cls] = {
                students: appData[cls],
                lastWeekProgress: '',
                thisWeekProgress: ''
            };
        }
        
        // 修正舊版學生屬性
        appData[cls].students.forEach(s => {
            if (s.totalPoints === undefined) {
                s.totalPoints = s.points || 0;
                s.sessionPoints = 0;
                delete s.points;
            }
        });
    });

    // --- Custom UI Modal Functions ---
    function customAlert(message) {
        document.getElementById('alertMessage').innerText = message;
        document.getElementById('customAlertModal').classList.remove('hidden');
    }
    
    function closeAlertModal() {
        document.getElementById('customAlertModal').classList.add('hidden');
    }

    let confirmCallback = null;
    function customConfirm(message, callback) {
        document.getElementById('confirmMessage').innerText = message;
        confirmCallback = callback;
        document.getElementById('customConfirmModal').classList.remove('hidden');
    }

    function closeConfirmModal() {
        document.getElementById('customConfirmModal').classList.add('hidden');
        confirmCallback = null;
    }

    document.getElementById('confirmBtn').onclick = () => {
        if (confirmCallback) confirmCallback();
        closeConfirmModal();
    };
    // -----------------------------------------------------------

    // 初始化
    window.onload = () => {
        if(!gasUrl) document.getElementById('settingsModal').classList.remove('hidden');
        updateClassSelect();
        
        // 監聽進度輸入，即時儲存至 appData
        document.getElementById('thisWeekProgressInput').addEventListener('input', (e) => {
            if (currentClass && appData[currentClass]) {
                appData[currentClass].thisWeekProgress = e.target.value;
                saveDataLocally();
            }
        });
    };

    function saveSettings() {
        gasUrl = document.getElementById('gasUrlInput').value.trim();
        if(gasUrl) {
            localStorage.setItem('gasUrl', gasUrl);
            document.getElementById('settingsModal').classList.add('hidden');
        } else {
            customAlert('請輸入有效的網址');
        }
    }

    function closeSettingsModal() {
        document.getElementById('settingsModal').classList.add('hidden');
    }

    function toggleImportModal() {
        const modal = document.getElementById('importModal');
        modal.classList.toggle('hidden');
    }

    // 處理手動資料匯入
    function processImport() {
        const className = document.getElementById('importClassName').value.trim();
        const rawData = document.getElementById('importData').value.trim();
        
        if (!className) return customAlert('請至少填寫班級名稱');

        const studentsArray = [];
        if (rawData) {
            const lines = rawData.split('\n');
            lines.forEach(line => {
                const parts = line.trim().split(/[\t,，\s]+/); 
                if (parts.length >= 2) {
                    studentsArray.push({
                        id: parts[0].trim(),
                        name: parts.slice(1).join(' ').trim(),
                        present: false,
                        sessionPoints: 0,
                        totalPoints: 0,
                        log: []
                    });
                }
            });
        }

        // 使用新結構建立班級
        appData[className] = {
            students: studentsArray,
            lastWeekProgress: '',
            thisWeekProgress: ''
        };
        
        saveDataLocally();
        updateClassSelect();
        document.getElementById('classSelect').value = className;
        loadClass(className);
        toggleImportModal();
        
        document.getElementById('importClassName').value = '';
        document.getElementById('importData').value = '';
    }

    function showAddStudentModal() {
        if (!currentClass) return;
        document.getElementById('newStudentId').value = '';
        document.getElementById('newStudentName').value = '';
        document.getElementById('addStudentModal').classList.remove('hidden');
        document.getElementById('newStudentId').focus();
    }

    function closeAddStudentModal() {
        document.getElementById('addStudentModal').classList.add('hidden');
    }

    function submitNewStudent() {
        const id = document.getElementById('newStudentId').value.trim();
        const name = document.getElementById('newStudentName').value.trim();
        
        if (!id || !name) {
            customAlert('學生座號與姓名皆不可空白！');
            return;
        }
        
        appData[currentClass].students.push({
            id: id,
            name: name,
            present: false,
            sessionPoints: 0,
            totalPoints: 0,
            log: []
        });
        saveDataLocally();
        renderGrid();
        closeAddStudentModal();
    }

    function updateClassSelect() {
        const select = document.getElementById('classSelect');
        select.innerHTML = '<option value="">選擇/建立班級</option>';
        Object.keys(appData).forEach(cls => {
            select.innerHTML += `<option value="${cls}">${cls} 班</option>`;
        });
    }

    document.getElementById('classSelect').addEventListener('change', (e) => {
        loadClass(e.target.value);
    });

    // 載入班級畫面
    function loadClass(className) {
        currentClass = className;
        const workspace = document.getElementById('workspace');
        const emptyState = document.getElementById('emptyState');
        const noteInput = document.getElementById('classNoteInput');
        const lastWeekDisplay = document.getElementById('lastWeekProgressDisplay');
        const thisWeekInput = document.getElementById('thisWeekProgressInput');
        
        if (!className || !appData[className]) {
            workspace.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        workspace.classList.remove('hidden');
        emptyState.classList.add('hidden');
        document.getElementById('currentClassTitle').innerText = `${className} 班 課堂互動區`;
        noteInput.value = ''; // 切換班級時清空單堂課堂紀錄
        
        // 載入班級進度狀態
        lastWeekDisplay.innerText = appData[className].lastWeekProgress || '尚無上週紀錄，請點擊上方「雲端下載」更新。';
        thisWeekInput.value = appData[className].thisWeekProgress || '';
        
        renderGrid();
    }

    // 渲染學生網格
    function renderGrid() {
        const grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        
        appData[currentClass].students.forEach((student, index) => {
            const card = document.createElement('div');
            card.className = `student-card border-2 rounded-xl p-4 flex flex-col justify-between shadow-sm ${student.present ? 'present' : 'absent'}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2 cursor-pointer" onclick="toggleAttendance(${index})">
                    <div class="flex flex-col">
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-bold text-gray-500">${student.id}</span>
                            <span class="text-lg font-bold text-gray-800">${student.name}</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1 font-medium"><i class="fas fa-star text-yellow-400 mr-1"></i>總計: <span id="total-${index}">${student.totalPoints}</span></div>
                    </div>
                    <div class="flex flex-col items-end">
                        <div class="text-xs text-indigo-400 font-bold mb-1">本日</div>
                        <div class="text-2xl font-black text-indigo-600 leading-none" id="pts-${index}">+${student.sessionPoints}</div>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-1 mt-2">
                    <button onclick="addPoint(${index}, 1, '出席/基本', event)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 py-1 rounded text-sm font-bold transition">+1</button>
                    <button onclick="addPoint(${index}, 2, '表現優良', event)" class="bg-orange-100 hover:bg-orange-200 text-orange-700 py-1 rounded text-sm font-bold transition">+2</button>
                    <button onclick="addPoint(${index}, 5, '任務完成', event)" class="bg-purple-100 hover:bg-purple-200 text-purple-700 py-1 rounded text-sm font-bold transition">+5</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 點名切換
    function toggleAttendance(index) {
        appData[currentClass].students[index].present = !appData[currentClass].students[index].present;
        
        if(appData[currentClass].students[index].present) {
            addPoint(index, 1, '出席預設', null, false);
        }
        
        saveDataLocally();
        renderGrid();
    }

    function markAllPresent() {
        appData[currentClass].students.forEach((s, idx) => {
            if(!s.present) {
                s.present = true;
                s.sessionPoints += 1;
                s.totalPoints += 1;
                s.log.push({type: '全班出席', value: 1});
            }
        });
        saveDataLocally();
        renderGrid();
    }

    // 加分邏輯
    function addPoint(index, value, reason, event = null, reRender = true) {
        if (event) {
            event.stopPropagation();
        }

        appData[currentClass].students[index].present = true;
        appData[currentClass].students[index].sessionPoints += value;
        appData[currentClass].students[index].totalPoints += value;
        appData[currentClass].students[index].log.push({
            type: reason,
            value: value,
            time: new Date().toLocaleTimeString()
        });
        
        saveDataLocally();

        if (reRender) {
            renderGrid();
        }
        
        setTimeout(() => {
            const ptsEl = document.getElementById(`pts-${index}`);
            const totalEl = document.getElementById(`total-${index}`);
            if(ptsEl) {
                ptsEl.classList.remove('point-pop');
                void ptsEl.offsetWidth;
                ptsEl.classList.add('point-pop');
            }
            if(totalEl) {
                totalEl.classList.remove('point-pop');
                void totalEl.offsetWidth;
                totalEl.classList.add('point-pop');
            }
        }, 10);
    }

    function resetPoints() {
        customConfirm('確定要將「本節課」的加分、點名與課堂紀錄歸零嗎？\n(注意：學生的「總累計積分」不受影響，依然會被保留)', () => {
            appData[currentClass].students.forEach(s => {
                s.present = false;
                s.sessionPoints = 0;
                s.log = [];
            });
            document.getElementById('classNoteInput').value = '';
            
            // 可選：是否要將本週進度一起清空？通常老師填好就留著，所以這裡保留不清除 thisWeekProgress
            saveDataLocally();
            renderGrid();
        });
    }

    function saveDataLocally() {
        localStorage.setItem('classData', JSON.stringify(appData));
    }

    // --- 從雲端下載名單 (對應後端 doGet) ---
    async function loadFromCloud() {
        if (!gasUrl) {
            document.getElementById('settingsModal').classList.remove('hidden');
            return;
        }

        customConfirm('【更新確認】\n確定要從雲端載入最新名單與「上週進度紀錄」嗎？\n這將會覆蓋您目前本地端尚未同步的加分紀錄！', async () => {
            const btn = document.querySelector('button[onclick="loadFromCloud()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 下載中...';
            btn.disabled = true;

            try {
                const response = await fetch(gasUrl);
                const result = await response.json();
                
                if (result.status === 'success') {
                    // 處理雲端資料格式，確保轉換為新版結構
                    const cloudData = result.data;
                    Object.keys(cloudData).forEach(cls => {
                        if (Array.isArray(cloudData[cls])) {
                            cloudData[cls] = {
                                students: cloudData[cls],
                                lastWeekProgress: '',
                                thisWeekProgress: ''
                            };
                        }
                    });

                    appData = cloudData;
                    saveDataLocally();
                    updateClassSelect();
                    
                    if (currentClass && appData[currentClass]) {
                        document.getElementById('classSelect').value = currentClass;
                        loadClass(currentClass);
                    } else {
                        currentClass = '';
                        document.getElementById('classSelect').value = '';
                        document.getElementById('workspace').classList.add('hidden');
                        document.getElementById('emptyState').classList.remove('hidden');
                    }
                    customAlert('✅ 成功從雲端載入所有班級最新資訊！');
                } else {
                    customAlert('❌ 載入失敗: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                customAlert('❌ 發生網路錯誤。\n請確認 GAS 網址正確，且部署權限已設為「所有人」。');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    }

    // --- 批次同步至 Google Sheets (對應後端 doPost) ---
    async function syncToCloud() {
        if (!gasUrl) {
            document.getElementById('settingsModal').classList.remove('hidden');
            return;
        }
        if (!currentClass) return customAlert('請先選擇要上傳的班級。');

        const btn = document.querySelector('button[onclick="syncToCloud()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 上傳中...';
        btn.disabled = true;

        const dateStr = new Date().toLocaleDateString();
        const classNote = document.getElementById('classNoteInput').value.trim();
        const thisWeekProgress = document.getElementById('thisWeekProgressInput').value.trim();
        
        // 更新本地端暫存
        appData[currentClass].thisWeekProgress = thisWeekProgress;
        saveDataLocally();

        const payload = {
            className: currentClass,
            date: dateStr,
            classNote: classNote, 
            thisWeekProgress: thisWeekProgress, // 新增：傳遞本週進度給後端
            students: appData[currentClass].students.map(s => ({
                id: s.id,
                name: s.name,
                present: s.present,
                sessionPoints: s.sessionPoints,
                totalPoints: s.totalPoints,
                details: s.log.map(l => l.type).join(', ')
            }))
        };

        try {
            const response = await fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', 
                }
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                customConfirm(`✅ 同步成功！已更新 ${currentClass} 班最新總分與本週進度。\n\n是否要順便將「本堂課」的點名與單堂加分歸零，以利下次上課使用？\n(進度文字將保留供您參考)`, () => {
                    appData[currentClass].students.forEach(s => {
                        s.present = false;
                        s.sessionPoints = 0;
                        s.log = [];
                    });
                    document.getElementById('classNoteInput').value = '';
                    saveDataLocally();
                    renderGrid();
                });
            } else {
                customAlert('❌ 同步失敗: ' + result.message);
            }
        } catch (error) {
            console.error('Error:', error);
            customAlert('❌ 發生網路錯誤或 CORS 問題。\n請確定 GAS 網址正確，且有設定為「所有人」皆可存取。');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
</script>
