```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AI智慧課堂控制台</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
font-family:Arial;
background:#f1f5f9;
}

.student-card{
transition:0.2s;
}

.student-card:hover{
transform:scale(1.03);
}

.timer{
font-size:80px;
font-weight:900;
}

</style>

</head>

<body class="p-6">

<div class="max-w-7xl mx-auto">

<h1 class="text-3xl font-black text-indigo-600 mb-6">
AI智慧課堂控制台
</h1>

<!-- 控制列 -->

<div class="flex gap-3 mb-6">

<button onclick="showPage('students')" class="bg-indigo-500 text-white px-4 py-2 rounded-lg">
學生
</button>

<button onclick="showPage('picker')" class="bg-orange-500 text-white px-4 py-2 rounded-lg">
抽籤
</button>

<button onclick="showPage('timer')" class="bg-green-500 text-white px-4 py-2 rounded-lg">
計時器
</button>

<button onclick="showPage('ranking')" class="bg-purple-500 text-white px-4 py-2 rounded-lg">
排行榜
</button>

</div>

<!-- 學生頁 -->

<div id="studentsPage">

<div class="grid grid-cols-4 gap-4" id="studentGrid"></div>

</div>

<!-- 抽籤 -->

<div id="pickerPage" class="hidden">

<h2 class="text-2xl font-bold mb-4">
隨機抽籤
</h2>

<div class="text-6xl font-black mb-4" id="pickedStudent">
?
</div>

<button onclick="pickStudent()" class="bg-indigo-500 text-white px-6 py-3 rounded-xl">
抽一位
</button>

</div>

<!-- 計時器 -->

<div id="timerPage" class="hidden text-center">

<h2 class="text-2xl font-bold mb-6">
專注計時器
</h2>

<div class="timer" id="timerDisplay">
10:00
</div>

<div class="flex gap-3 justify-center mt-6">

<button onclick="startTimer()" class="bg-indigo-500 text-white px-5 py-3 rounded-lg">
開始
</button>

<button onclick="pauseTimer()" class="bg-yellow-500 text-white px-5 py-3 rounded-lg">
暫停
</button>

<button onclick="resetTimer()" class="bg-red-500 text-white px-5 py-3 rounded-lg">
重置
</button>

</div>

<div class="mt-6">

<button onclick="setTimer(300)" class="bg-gray-200 px-4 py-2 rounded-lg">
5分鐘
</button>

<button onclick="setTimer(600)" class="bg-gray-200 px-4 py-2 rounded-lg">
10分鐘
</button>

<button onclick="setTimer(900)" class="bg-gray-200 px-4 py-2 rounded-lg">
15分鐘
</button>

</div>

<h3 class="mt-8 font-bold">
專注音樂
</h3>

<div class="flex gap-3 justify-center mt-2">

<button onclick="playMusic('rain')" class="bg-blue-400 text-white px-4 py-2 rounded-lg">
雨聲
</button>

<button onclick="playMusic('white')" class="bg-gray-500 text-white px-4 py-2 rounded-lg">
白噪音
</button>

<button onclick="stopMusic()" class="bg-red-400 text-white px-4 py-2 rounded-lg">
停止
</button>

</div>

<audio id="music" loop></audio>

</div>

<!-- 排行榜 -->

<div id="rankingPage" class="hidden">

<h2 class="text-2xl font-bold mb-4">
排行榜
</h2>

<div id="ranking"></div>

</div>

</div>

<script>

let students=[
{name:"王小明",score:0},
{name:"林小美",score:0},
{name:"陳大華",score:0},
{name:"李志強",score:0}
]

function renderStudents(){

let grid=document.getElementById("studentGrid")

grid.innerHTML=""

students.forEach((s,i)=>{

grid.innerHTML+=`

<div class="student-card bg-white p-4 rounded-xl shadow">

<h3 class="font-bold text-lg">${s.name}</h3>

<p class="text-xl">${s.score}</p>

<button onclick="addPoint(${i})" class="bg-indigo-500 text-white px-3 py-1 rounded mt-2">
+1
</button>

</div>

`

})

}

function addPoint(i){

students[i].score++

renderStudents()

renderRanking()

}

function renderRanking(){

let sorted=[...students].sort((a,b)=>b.score-a.score)

let html=""

sorted.forEach((s,i)=>{

html+=`<p>${i+1}. ${s.name} - ${s.score}</p>`

})

document.getElementById("ranking").innerHTML=html

}

function pickStudent(){

let s=students[Math.floor(Math.random()*students.length)]

document.getElementById("pickedStudent").innerText=s.name

}

function showPage(page){

document.getElementById("studentsPage").classList.add("hidden")
document.getElementById("pickerPage").classList.add("hidden")
document.getElementById("timerPage").classList.add("hidden")
document.getElementById("rankingPage").classList.add("hidden")

if(page==="students")document.getElementById("studentsPage").classList.remove("hidden")
if(page==="picker")document.getElementById("pickerPage").classList.remove("hidden")
if(page==="timer")document.getElementById("timerPage").classList.remove("hidden")
if(page==="ranking")document.getElementById("rankingPage").classList.remove("hidden")

}

let timeLeft=600
let timer

function updateTimer(){

let m=Math.floor(timeLeft/60)
let s=timeLeft%60

document.getElementById("timerDisplay").innerText=
String(m).padStart(2,'0')+":"+String(s).padStart(2,'0')

}

function startTimer(){

clearInterval(timer)

timer=setInterval(()=>{

if(timeLeft>0){

timeLeft--
updateTimer()

}else{

clearInterval(timer)
alert("時間到")

}

},1000)

}

function pauseTimer(){

clearInterval(timer)

}

function resetTimer(){

timeLeft=600
updateTimer()

}

function setTimer(sec){

timeLeft=sec
updateTimer()

}

function playMusic(type){

let music=document.getElementById("music")

if(type==="rain")
music.src="https://cdn.pixabay.com/audio/2022/03/15/audio_1a9e78c1d5.mp3"

if(type==="white")
music.src="https://cdn.pixabay.com/audio/2021/11/25/audio_91a50f3d40.mp3"

music.play()

}

function stopMusic(){

document.getElementById("music").pause()

}

renderStudents()
renderRanking()

</script>

</body>
</html>
```
