<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖像文字去框修改工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+HK:wght@400;700&family=Noto+Serif+HK:wght@400;700&family=LXGW+WenKai+TC&family=ZCOOL+XiaoWei&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Oswald:wght@700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@700&family=Pacifico&family=Lobster&family=Bebas+Neue&family=Anton&family=Caveat:wght@700&family=Great+Vibes&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        #canvas { touch-action: none; }
        .hidden { display: none !important; }
        .checkerboard {
            background-color: #f0f0f0;
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.1s;
            flex-shrink: 0;
        }
        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.selected {
            border-color: #2563eb;
            box-shadow: 0 0 0 1px #2563eb;
        }
        #colorPickerWrapper { position: relative; }
        #customColorBtn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px dashed #9ca3af;
            background: linear-gradient(135deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff);
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        #customColorBtn:hover { transform: scale(1.15); }
        #fontColor { 
            position: absolute; 
            opacity: 0; 
            width: 0; 
            height: 0; 
            pointer-events: none;
        }

        /* 文字輸入框：確保輸入法（注音/拼音）能正常組字 */
        #newText {
            ime-mode: active;
            -webkit-user-select: text;
            user-select: text;
        }
        #fontPreview {
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #374151;
            line-height: 1.4;
            word-break: break-word;
            text-align: center;
        }

        /* ── 放大鏡樣式 ── */
        #magnifier {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            box-shadow: 0 4px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.3) inset;
            pointer-events: none;
            display: none;
            overflow: hidden;
            z-index: 100;
            background: #fff;
        }
        #magnifier::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid rgba(59,130,246,0.7);
            z-index: 2;
            pointer-events: none;
        }
        #magnifier::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(59,130,246,0.4);
            z-index: 2;
            pointer-events: none;
        }
        #magnifierCanvas {
            position: absolute;
            top: 0; left: 0;
            border-radius: 50%;
        }
        #magnifierCrossH {
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 1px;
            background: rgba(59,130,246,0.5);
            transform: translateY(-50%);
            z-index: 3;
            pointer-events: none;
        }
        #magnifierCrossV {
            position: absolute;
            left: 50%;
            top: 0; bottom: 0;
            width: 1px;
            background: rgba(59,130,246,0.5);
            transform: translateX(-50%);
            z-index: 3;
            pointer-events: none;
        }
        #magnifierLabel {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59,130,246,0.92);
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            white-space: nowrap;
            pointer-events: none;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        #toggleMagnifierBtn.active {
            background-color: #1d4ed8 !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.4);
        }

        #magnifierControls { transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 min-h-screen font-sans flex justify-center items-start">
    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 p-6 text-white">
            <h1 class="text-2xl font-bold">🛠️ 圖像去背與文字修改工具</h1>
            <p class="text-blue-100 mt-2 text-sm">支援去背、抹除 Logo、替換文字，且文字新增後可自由拖曳移動位置。</p>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 左側控制面板 -->
            <div class="lg:col-span-4 space-y-6">

                <!-- 步驟 1 -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-bold text-gray-800 mb-2">1. 上傳原始圖片</label>
                    <input type="file" id="imageUpload" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 transition">
                </div>

                <!-- 🔍 放大鏡功能 -->
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <label class="block text-sm font-bold text-blue-800 mb-2">🔍 局部放大鏡</label>
                    <p class="text-xs text-blue-600 mb-3">開啟後，滑鼠移至圖片上即可即時放大，方便精確操作。</p>
                    <button id="toggleMagnifierBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-2 rounded-lg hover:bg-blue-700 transition shadow-md text-sm mb-3">
                        🔍 啟用放大鏡
                    </button>
                    <div id="magnifierControls" class="space-y-2">
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-medium text-gray-700 w-14">放大倍率:</label>
                            <input type="range" id="zoomLevel" min="2" max="8" value="3" step="0.5" class="flex-1 cursor-pointer">
                            <span id="zoomVal" class="text-xs text-gray-600 w-8 text-right font-mono">3×</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-medium text-gray-700 w-14">鏡頭大小:</label>
                            <input type="range" id="lensSize" min="100" max="300" value="220" step="10" class="flex-1 cursor-pointer">
                            <span id="lensSizeVal" class="text-xs text-gray-600 w-8 text-right font-mono">220</span>
                        </div>
                    </div>
                </div>

                <!-- 步驟 2：去背 -->
                <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
                    <label class="block text-sm font-bold text-purple-800 mb-2">2. 圖片去背 (選用)</label>
                    <p class="text-xs text-purple-600 mb-3">啟用後，點擊右側圖片上的背景顏色，即可將其變為透明。</p>
                    <button id="toggleRemoveBgBtn" class="w-full bg-purple-600 text-white font-bold py-2 px-2 rounded-lg hover:bg-purple-700 transition shadow-md text-sm mb-3">
                        🪄 啟用魔術棒去背
                    </button>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-medium text-gray-700 w-16">色彩容差:</label>
                        <input type="range" id="bgTolerance" min="0" max="255" value="30" class="flex-1 cursor-pointer">
                        <span id="toleranceVal" class="text-xs text-gray-600 w-6 text-right">30</span>
                    </div>
                </div>

                <!-- 步驟 3：消除 -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-bold text-gray-800">3. 框選並消除雜物</label>
                    <p class="text-xs text-gray-600 mt-1">在右圖上「按住滑鼠拖曳」框選範圍，再點擊下方消除按鈕。</p>
                    <div class="mt-3 grid grid-cols-2 gap-2 items-end">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">覆蓋背景色</label>
                            <div class="flex items-center mt-1">
                                <input type="color" id="bgColor" value="#f8ecd9" class="h-8 w-8 rounded border border-gray-300 cursor-pointer">
                            </div>
                        </div>
                        <button id="eraseBtn" class="bg-orange-500 text-white font-bold py-2 px-2 rounded-lg hover:bg-orange-600 transition shadow-md flex justify-center items-center text-sm h-10">
                            🧽 消除框選區
                        </button>
                    </div>
                </div>

                <!-- 步驟 4：新增文字 -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-4">
                    <label class="block text-sm font-bold text-gray-800 mb-2">4. 新增替換文字</label>
                    
                    <div>
                        <textarea id="newText" rows="3" lang="zh-Hant" inputmode="text"
                            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                            enterkeyhint="enter"
                            class="mt-1 block w-full rounded-md border border-gray-300 p-2 text-sm focus:ring-blue-500 focus:border-blue-500">收好食物，不圍觀驚叫並&#10;安靜繞道。</textarea>
                        <p class="text-[11px] text-gray-400 mt-1">提示：可直接用注音／拼音輸入；按 Enter 換行。</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">字型</label>
                            <select id="fontFamily" class="mt-1 block w-full rounded-md border border-gray-300 p-1.5 text-sm bg-white">
                                <optgroup label="── 黑體／無襯線">
                                    <option value='"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif'>微軟正黑體</option>
                                    <option value='"Noto Sans TC", "PingFang TC", sans-serif'>思源黑體（繁中）</option>
                                    <option value='"Noto Sans HK", "Noto Sans TC", sans-serif'>思源黑體（香港）</option>
                                    <option value='"Noto Sans SC", sans-serif'>思源黑體（簡中）</option>
                                </optgroup>
                                <optgroup label="── 明體／宋體">
                                    <option value='"PMingLiU", "MingLiU", serif'>新細明體</option>
                                    <option value='"Noto Serif TC", "PMingLiU", serif'>思源宋體（繁中）</option>
                                    <option value='"Noto Serif HK", "Noto Serif TC", serif'>思源宋體（香港）</option>
                                    <option value='"Noto Serif SC", serif'>思源宋體（簡中）</option>
                                </optgroup>
                                <optgroup label="── 楷體／圓體">
                                    <option value='"DFKai-SB", "BiauKai", "KaiTi", serif'>標楷體（系統）</option>
                                    <option value='"LXGW WenKai TC", "DFKai-SB", serif'>霞鶩文楷（手寫楷體）</option>
                                    <option value='"ZCOOL XiaoWei", serif'>站酷小薇（古典）</option>
                                    <option value='"ZCOOL QingKe HuangYou", cursive'>站酷慶科黃油（圓潤可愛）</option>
                                    <option value='"ZCOOL KuaiLe", cursive'>站酷快樂體（活潑）</option>
                                </optgroup>
                                <optgroup label="── 手寫／毛筆">
                                    <option value='"Ma Shan Zheng", cursive'>馬善政毛筆體</option>
                                    <option value='"Long Cang", cursive'>龍藏體（隨性手寫）</option>
                                    <option value='"Zhi Mang Xing", cursive'>智芒星（行書風）</option>
                                    <option value='"Liu Jian Mao Cao", cursive'>劉建毛草（狂草）</option>
                                </optgroup>
                                <optgroup label="── 英文裝飾">
                                    <option value='"Oswald", Impact, sans-serif'>Oswald（粗壯）</option>
                                    <option value='"Bebas Neue", Impact, sans-serif'>Bebas Neue（標題體）</option>
                                    <option value='"Anton", Impact, sans-serif'>Anton（極粗）</option>
                                    <option value='"Playfair Display", Georgia, serif'>Playfair Display（典雅）</option>
                                    <option value='"Lobster", cursive'>Lobster（圓潤手寫）</option>
                                    <option value='"Pacifico", cursive'>Pacifico（衝浪風）</option>
                                    <option value='"Dancing Script", cursive'>Dancing Script（流暢手寫）</option>
                                    <option value='"Great Vibes", cursive'>Great Vibes（優雅花體）</option>
                                    <option value='"Caveat", cursive'>Caveat（隨手筆記）</option>
                                    <option value='"Permanent Marker", cursive'>Permanent Marker（麥克筆）</option>
                                </optgroup>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">字體大小</label>
                            <input type="number" id="fontSize" value="20" class="mt-1 block w-full rounded-md border border-gray-300 p-1.5 text-sm">
                        </div>
                    </div>

                    <!-- 📏 偵測原圖字級 -->
                    <div class="bg-amber-50 border border-amber-200 rounded-md p-3">
                        <button id="detectSizeBtn" class="w-full bg-amber-500 text-white font-bold py-2 px-2 rounded-lg hover:bg-amber-600 transition shadow-md text-sm">
                            📏 偵測原圖字級（先框選一行舊文字）
                        </button>
                        <p class="text-[11px] text-amber-700 mt-2 leading-relaxed">
                            在右圖框住「原本要替換掉的一行文字」後點此，會自動分析筆畫高度、推算字級並填入上方欄位。建議在去背／消除「之前」先偵測。
                        </p>
                        <div id="detectResult" class="hidden mt-2 text-xs font-medium text-amber-800 bg-white rounded px-2 py-1 border border-amber-200"></div>
                    </div>

                    <!-- 字型即時預覽 -->
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">字型預覽</label>
                        <div id="fontPreview" class="rounded-md border border-gray-200 bg-white px-2 py-2">永 字 八 法 Aa 123</div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-2">文字顏色</label>
                        <div class="flex items-center gap-2 mt-2">
                            <input type="checkbox" id="fontBold" checked class="cursor-pointer">
                            <label for="fontBold" class="text-xs font-medium text-gray-700">粗體</label>
                            <div class="color-swatch selected" data-color="#2d2d2d" style="background:#2d2d2d;" title="深黑"></div>
                            <div class="color-swatch" data-color="#ffffff" style="background:#ffffff; border-color:#d1d5db;" title="白色"></div>
                            <div class="color-swatch" data-color="#dc2626" style="background:#dc2626;" title="紅色"></div>
                            <div class="color-swatch" data-color="#ea580c" style="background:#ea580c;" title="橙色"></div>
                            <div class="color-swatch" data-color="#ca8a04" style="background:#ca8a04;" title="黃色"></div>
                            <div class="color-swatch" data-color="#16a34a" style="background:#16a34a;" title="綠色"></div>
                            <div class="color-swatch" data-color="#2563eb" style="background:#2563eb;" title="藍色"></div>
                            <div class="color-swatch" data-color="#7c3aed" style="background:#7c3aed;" title="紫色"></div>
                            <div class="color-swatch" data-color="#db2777" style="background:#db2777;" title="粉紅"></div>
                            <div id="colorPickerWrapper" title="自訂顏色">
                                <div id="customColorBtn"></div>
                                <input type="color" id="fontColor" value="#2d2d2d">
                            </div>
                        </div>
                        <div class="mt-2 flex items-center gap-2">
                            <div id="selectedColorPreview" style="width:16px;height:16px;border-radius:3px;background:#2d2d2d;border:1px solid #d1d5db;flex-shrink:0;"></div>
                            <span class="text-xs text-gray-500">目前顏色：</span>
                            <span id="selectedColorHex" class="text-xs font-mono text-gray-700">#2d2d2d</span>
                            <span id="selectedColorSample" class="text-xs font-bold ml-1" style="color:#2d2d2d;">Aa</span>
                        </div>
                    </div>
                    
                    <button id="applyTextBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-2 rounded-lg hover:bg-blue-700 transition shadow-md flex justify-center items-center text-sm">
                        📝 新增文字 (新增後可拖曳)
                    </button>
                </div>

                <!-- 復原與下載 -->
                <div class="flex gap-2 pt-2">
                    <button id="undoBtn" class="flex-1 bg-gray-500 text-white py-2 px-4 rounded-lg hover:bg-gray-600 transition hidden text-sm font-bold">
                        ↺ 復原上一步
                    </button>
                    <button id="downloadBtn" class="flex-1 bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition shadow-md hidden text-sm">
                        ⬇️ 下載完成圖
                    </button>
                </div>
            </div>

            <!-- 右側畫布區域 -->
            <div class="lg:col-span-8">
                <div class="border-2 border-dashed border-gray-300 rounded-xl overflow-hidden relative bg-gray-100 flex items-center justify-center min-h-[500px] h-full shadow-inner checkerboard" id="canvasContainer">
                    <div id="placeholderText" class="text-gray-400 flex flex-col items-center z-10 relative">
                        <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>請先由左側上傳圖片</span>
                    </div>
                    <canvas id="canvas" class="max-w-full h-auto hidden object-contain cursor-crosshair"></canvas>

                    <!-- 放大鏡浮層 -->
                    <div id="magnifier">
                        <canvas id="magnifierCanvas"></canvas>
                        <div id="magnifierCrossH"></div>
                        <div id="magnifierCrossV"></div>
                        <div id="magnifierLabel">3× ｜ (0, 0)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── DOM refs ──
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholderText = document.getElementById('placeholderText');
        const applyTextBtn = document.getElementById('applyTextBtn');
        const eraseBtn = document.getElementById('eraseBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const undoBtn = document.getElementById('undoBtn');
        const toggleRemoveBgBtn = document.getElementById('toggleRemoveBgBtn');
        const bgToleranceInput = document.getElementById('bgTolerance');
        const toleranceVal = document.getElementById('toleranceVal');
        const canvasContainer = document.getElementById('canvasContainer');
        const newTextEl = document.getElementById('newText');
        const fontFamilyEl = document.getElementById('fontFamily');
        const fontSizeEl = document.getElementById('fontSize');
        const fontBoldEl = document.getElementById('fontBold');
        const fontPreviewEl = document.getElementById('fontPreview');

        // ── 放大鏡 DOM ──
        const magnifierEl = document.getElementById('magnifier');
        const magnifierCanvas = document.getElementById('magnifierCanvas');
        const magnifierCtx = magnifierCanvas.getContext('2d');
        const magnifierLabel = document.getElementById('magnifierLabel');
        const toggleMagnifierBtn = document.getElementById('toggleMagnifierBtn');
        const zoomLevelInput = document.getElementById('zoomLevel');
        const zoomValSpan = document.getElementById('zoomVal');
        const lensSizeInput = document.getElementById('lensSize');
        const lensSizeValSpan = document.getElementById('lensSizeVal');

        // ── 輸入法（IME）組字狀態：避免選字過程被誤判 ──
        let isComposing = false;
        newTextEl.addEventListener('compositionstart', () => { isComposing = true; });
        newTextEl.addEventListener('compositionend', () => {
            isComposing = false;
            updateFontPreview();
        });
        // 確保點擊輸入框一定能取得焦點以喚起輸入法
        newTextEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); });

        // ── 字型即時預覽 ──
        function updateFontPreview() {
            const fam = fontFamilyEl.value;
            const bold = fontBoldEl.checked ? '700' : '400';
            const sample = (newTextEl.value.split('\n')[0] || '').trim() || '永 字 八 法 Aa 123';
            fontPreviewEl.style.fontFamily = fam;
            fontPreviewEl.style.fontWeight = bold;
            fontPreviewEl.style.color = selectedColor;
            fontPreviewEl.textContent = sample;
        }
        fontFamilyEl.addEventListener('change', updateFontPreview);
        fontBoldEl.addEventListener('change', updateFontPreview);
        newTextEl.addEventListener('input', () => { if (!isComposing) updateFontPreview(); });

        // ── 放大鏡狀態 ──
        let magnifierEnabled = false;
        let zoomLevel = 3;
        let lensSize = 220;

        function updateMagnifierSize() {
            lensSize = parseInt(lensSizeInput.value);
            lensSizeValSpan.textContent = lensSize;
            magnifierEl.style.width = lensSize + 'px';
            magnifierEl.style.height = lensSize + 'px';
            magnifierCanvas.width = lensSize;
            magnifierCanvas.height = lensSize;
        }

        zoomLevelInput.addEventListener('input', () => {
            zoomLevel = parseFloat(zoomLevelInput.value);
            zoomValSpan.textContent = zoomLevel + '×';
        });

        lensSizeInput.addEventListener('input', () => {
            updateMagnifierSize();
        });

        toggleMagnifierBtn.addEventListener('click', () => {
            magnifierEnabled = !magnifierEnabled;
            if (magnifierEnabled) {
                toggleMagnifierBtn.textContent = '🔍 關閉放大鏡';
                toggleMagnifierBtn.classList.add('active');
            } else {
                toggleMagnifierBtn.textContent = '🔍 啟用放大鏡';
                toggleMagnifierBtn.classList.remove('active');
                magnifierEl.style.display = 'none';
            }
        });

        function drawMagnifier(canvasX, canvasY, containerMouseX, containerMouseY) {
            if (!magnifierEnabled || !baseImageData) return;

            const half = lensSize / 2;
            const srcSize = lensSize / zoomLevel;

            let srcX = canvasX - srcSize / 2;
            let srcY = canvasY - srcSize / 2;

            const containerRect = canvasContainer.getBoundingClientRect();

            let magLeft = containerMouseX + 20;
            let magTop = containerMouseY - lensSize - 20;

            if (magLeft + lensSize > containerRect.width - 10) {
                magLeft = containerMouseX - lensSize - 20;
            }
            if (magTop < 10) {
                magTop = containerMouseY + 20;
            }

            magnifierEl.style.display = 'block';
            magnifierEl.style.left = magLeft + 'px';
            magnifierEl.style.top = magTop + 'px';

            magnifierCtx.clearRect(0, 0, lensSize, lensSize);

            magnifierCtx.fillStyle = '#f0f0f0';
            magnifierCtx.fillRect(0, 0, lensSize, lensSize);
            for (let gx = 0; gx < lensSize; gx += 10) {
                for (let gy = 0; gy < lensSize; gy += 10) {
                    if ((Math.floor(gx / 10) + Math.floor(gy / 10)) % 2 === 0) {
                        magnifierCtx.fillStyle = '#cccccc';
                        magnifierCtx.fillRect(gx, gy, 10, 10);
                    }
                }
            }

            magnifierCtx.save();
            magnifierCtx.beginPath();
            magnifierCtx.arc(half, half, half, 0, Math.PI * 2);
            magnifierCtx.clip();

            magnifierCtx.drawImage(
                canvas,
                srcX, srcY, srcSize, srcSize,
                0, 0, lensSize, lensSize
            );

            magnifierCtx.restore();

            const displayX = Math.round(canvasX);
            const displayY = Math.round(canvasY);
            magnifierLabel.textContent = `${zoomLevel}× ｜ (${displayX}, ${displayY})`;
        }

        // ── 顏色選擇器 ──
        let selectedColor = '#2d2d2d';
        const fontColorInput = document.getElementById('fontColor');
        const customColorBtn = document.getElementById('customColorBtn');
        const selectedColorPreview = document.getElementById('selectedColorPreview');
        const selectedColorHex = document.getElementById('selectedColorHex');
        const selectedColorSample = document.getElementById('selectedColorSample');
        const swatches = document.querySelectorAll('.color-swatch');

        function setSelectedColor(color) {
            selectedColor = color;
            selectedColorPreview.style.background = color;
            selectedColorHex.textContent = color;
            selectedColorSample.style.color = color;
            if (color.toLowerCase() === '#ffffff') {
                selectedColorSample.style.textShadow = '0 0 2px #aaa';
            } else {
                selectedColorSample.style.textShadow = '';
            }
            updateFontPreview();
        }

        swatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                swatches.forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
                setSelectedColor(swatch.dataset.color);
                fontColorInput.value = swatch.dataset.color;
            });
        });

        customColorBtn.addEventListener('click', () => { fontColorInput.click(); });
        fontColorInput.addEventListener('input', (e) => {
            swatches.forEach(s => s.classList.remove('selected'));
            setSelectedColor(e.target.value);
        });
        fontColorInput.addEventListener('change', (e) => {
            swatches.forEach(s => s.classList.remove('selected'));
            setSelectedColor(e.target.value);
        });

        // ── 畫布與狀態 ──
        let img = new Image();
        let baseImageData = null;
        let textObjects = [];
        let actionHistory = [];
        let currentMode = 'select';
        let isDrawing = false;
        let startX, startY;
        let selectionBox = null;
        let draggingTextIndex = -1;
        let dragOffsetX = 0, dragOffsetY = 0;
        let detectionOverlay = null;
        let detectionTimer = null;

        bgToleranceInput.addEventListener('input', (e) => {
            toleranceVal.textContent = e.target.value;
        });

        function saveState() {
            if (actionHistory.length > 15) actionHistory.shift();
            const clonedData = new ImageData(
                new Uint8ClampedArray(baseImageData.data),
                baseImageData.width,
                baseImageData.height
            );
            const clonedTexts = JSON.parse(JSON.stringify(textObjects));
            actionHistory.push({ imageData: clonedData, textObjects: clonedTexts });
            undoBtn.classList.remove('hidden');
            downloadBtn.classList.remove('hidden');
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    textObjects = [];
                    actionHistory = [];
                    selectionBox = null;
                    canvas.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    downloadBtn.classList.add('hidden');
                    undoBtn.classList.add('hidden');
                    updateMagnifierSize();
                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            } else {
                clientX = evt.clientX;
                clientY = evt.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
                containerX: clientX - canvasContainer.getBoundingClientRect().left,
                containerY: clientY - canvasContainer.getBoundingClientRect().top
            };
        }

        function checkTextHit(pos) {
            for (let i = textObjects.length - 1; i >= 0; i--) {
                const t = textObjects[i];
                if (pos.x >= t.x && pos.x <= t.x + t.width &&
                    pos.y >= t.y && pos.y <= t.y + t.height) {
                    return i;
                }
            }
            return -1;
        }

        function redrawCanvas() {
            if (!baseImageData) return;
            ctx.putImageData(baseImageData, 0, 0);
            if (selectionBox) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
                ctx.lineWidth = 4;
                ctx.setLineDash([8, 8]);
                ctx.strokeRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
                ctx.fillRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
            }
            textObjects.forEach((t, index) => {
                // 粗體狀態改為「每段文字各自記住」，不再受目前勾選框影響
                const weight = t.bold ? 'bold' : 'normal';
                ctx.font = `${weight} ${t.fontSize}px ${t.fontFamily}`;
                ctx.fillStyle = t.color;
                ctx.textBaseline = 'top';
                const lineHeight = t.fontSize * 1.6;
                t.lines.forEach((line, lineIdx) => {
                    ctx.fillText(line, t.x, t.y + (lineIdx * lineHeight));
                });
                if (index === draggingTextIndex) {
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.strokeRect(t.x - 4, t.y - 4, t.width + 8, t.height + 8);
                    ctx.setLineDash([]);
                }
            });
            // 偵測字級時，標示量到的文字高度區帶
            if (detectionOverlay) {
                const d = detectionOverlay;
                ctx.strokeStyle = '#16a34a';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(d.x, d.y, d.w, d.h);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(22, 163, 74, 0.15)';
                ctx.fillRect(d.x, d.y, d.w, d.h);
                // 高度標籤
                const label = `≈ ${d.size}px`;
                ctx.font = `bold ${Math.max(14, Math.round(d.h * 0.5))}px sans-serif`;
                const tw = ctx.measureText(label).width;
                const lx = d.x;
                const ly = d.y - Math.max(18, Math.round(d.h * 0.55)) - 4;
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(lx, ly, tw + 12, Math.max(18, Math.round(d.h * 0.55)) + 4);
                ctx.fillStyle = '#ffffff';
                ctx.textBaseline = 'top';
                ctx.fillText(label, lx + 6, ly + 2);
            }
        }

        function removeBackgroundColor(x, y) {
            const targetColorData = ctx.getImageData(x, y, 1, 1).data;
            const r = targetColorData[0], g = targetColorData[1], b = targetColorData[2], a = targetColorData[3];
            if (a === 0) return;
            saveState();
            const tolerance = parseInt(bgToleranceInput.value);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const diff = Math.sqrt(
                    Math.pow(data[i] - r, 2) + Math.pow(data[i+1] - g, 2) + Math.pow(data[i+2] - b, 2)
                );
                if (diff <= tolerance) data[i+3] = 0;
            }
            baseImageData = imgData;
            redrawCanvas();
        }

        toggleRemoveBgBtn.addEventListener('click', () => {
            if (currentMode === 'select') {
                currentMode = 'removeBg';
                toggleRemoveBgBtn.innerHTML = '🛑 關閉去背模式';
                toggleRemoveBgBtn.classList.replace('bg-purple-600', 'bg-red-500');
                toggleRemoveBgBtn.classList.replace('hover:bg-purple-700', 'hover:bg-red-600');
                canvas.style.cursor = 'crosshair';
                selectionBox = null;
                redrawCanvas();
            } else {
                currentMode = 'select';
                toggleRemoveBgBtn.innerHTML = '🪄 啟用魔術棒去背';
                toggleRemoveBgBtn.classList.replace('bg-red-500', 'bg-purple-600');
                toggleRemoveBgBtn.classList.replace('hover:bg-red-600', 'hover:bg-purple-700');
                canvas.style.cursor = 'crosshair';
            }
        });

        // ── 滑鼠移動：觸發放大鏡 ──
        canvas.addEventListener('mousemove', (e) => {
            if (!baseImageData) return;
            const pos = getPos(e);

            if (magnifierEnabled) {
                drawMagnifier(pos.x, pos.y, pos.containerX, pos.containerY);
            }

            if (draggingTextIndex !== -1) {
                // 拖曳中
            } else if (!isDrawing) {
                if (checkTextHit(pos) !== -1) {
                    canvas.style.cursor = 'grab';
                } else {
                    canvas.style.cursor = 'crosshair';
                }
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (magnifierEnabled) {
                magnifierEl.style.display = 'none';
            }
        });

        function handleInputStart(e) {
            if (!baseImageData) return;
            const pos = getPos(e);
            const hitIndex = checkTextHit(pos);
            if (hitIndex !== -1) {
                draggingTextIndex = hitIndex;
                const t = textObjects[hitIndex];
                dragOffsetX = pos.x - t.x;
                dragOffsetY = pos.y - t.y;
                canvas.style.cursor = 'grabbing';
                redrawCanvas();
                return;
            }
            if (currentMode === 'removeBg') {
                removeBackgroundColor(pos.x, pos.y);
                return;
            }
            startX = pos.x;
            startY = pos.y;
            isDrawing = true;
            selectionBox = null;
        }

        function handleInputMove(e) {
            if (!baseImageData) return;
            const pos = getPos(e);

            if (magnifierEnabled && e.type === 'touchmove') {
                drawMagnifier(pos.x, pos.y, pos.containerX, pos.containerY);
            }

            if (draggingTextIndex !== -1) {
                textObjects[draggingTextIndex].x = pos.x - dragOffsetX;
                textObjects[draggingTextIndex].y = pos.y - dragOffsetY;
                redrawCanvas();
                return;
            }
            if (isDrawing) {
                selectionBox = {
                    x: Math.min(startX, pos.x),
                    y: Math.min(startY, pos.y),
                    w: Math.abs(pos.x - startX),
                    h: Math.abs(pos.y - startY)
                };
                redrawCanvas();
            }
        }

        function handleInputEnd() {
            if (draggingTextIndex !== -1) saveState();
            isDrawing = false;
            draggingTextIndex = -1;
            redrawCanvas();
            if (currentMode === 'select') canvas.style.cursor = 'crosshair';
        }

        canvas.addEventListener('mousedown', handleInputStart);
        canvas.addEventListener('mouseup', handleInputEnd);
        canvas.addEventListener('mouseout', handleInputEnd);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInputMove(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd(); }, { passive: false });
        canvas.addEventListener('mousemove', handleInputMove);

        // ── 📏 偵測原圖字級 ──
        // 原理：分析框選區內的水平投影（每一橫列的筆畫像素量），
        // 自動找出文字所在的高度區帶，其像素高度≈中文字級。
        const detectSizeBtn = document.getElementById('detectSizeBtn');
        const detectResult = document.getElementById('detectResult');

        function showDetectResult(msg, ok = true) {
            detectResult.classList.remove('hidden');
            detectResult.textContent = msg;
            detectResult.classList.toggle('text-amber-800', ok);
            detectResult.classList.toggle('text-red-600', !ok);
        }

        function detectFontSize() {
            if (!baseImageData) { alert('請先上傳圖片！'); return; }
            if (!selectionBox || selectionBox.w < 4 || selectionBox.h < 4) {
                showDetectResult('請先在右圖框住一行「原本的文字」，再按偵測。', false);
                return;
            }
            const W = baseImageData.width, H = baseImageData.height;
            const data = baseImageData.data;

            let bx = Math.max(0, Math.round(selectionBox.x));
            let by = Math.max(0, Math.round(selectionBox.y));
            let bw = Math.min(Math.round(selectionBox.w), W - bx);
            let bh = Math.min(Math.round(selectionBox.h), H - by);
            if (bw < 3 || bh < 3) { showDetectResult('框選範圍太小，請框大一點。', false); return; }

            const lumAt = (px, py) => {
                const i = (py * W + px) * 4;
                if (data[i + 3] === 0) return null; // 透明視為背景
                return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            };

            // 用框的四個邊估計背景亮度（取中位數）
            const bgSamples = [];
            for (let px = bx; px < bx + bw; px++) {
                const t = lumAt(px, by); if (t !== null) bgSamples.push(t);
                const b = lumAt(px, by + bh - 1); if (b !== null) bgSamples.push(b);
            }
            for (let py = by; py < by + bh; py++) {
                const l = lumAt(bx, py); if (l !== null) bgSamples.push(l);
                const r = lumAt(bx + bw - 1, py); if (r !== null) bgSamples.push(r);
            }
            if (bgSamples.length === 0) { showDetectResult('此區域為透明，無法偵測。', false); return; }
            bgSamples.sort((a, b) => a - b);
            const bgLum = bgSamples[Math.floor(bgSamples.length / 2)];
            const inkThresh = 55; // 與背景亮度差超過此值視為筆畫

            // 水平投影：每一橫列的筆畫像素數
            const rowCounts = new Array(bh).fill(0);
            for (let ry = 0; ry < bh; ry++) {
                let cnt = 0; const py = by + ry;
                for (let px = bx; px < bx + bw; px++) {
                    const L = lumAt(px, py);
                    if (L !== null && Math.abs(L - bgLum) > inkThresh) cnt++;
                }
                rowCounts[ry] = cnt;
            }
            const maxRow = Math.max(...rowCounts);
            if (maxRow < Math.max(2, bw * 0.02)) {
                showDetectResult('偵測不到明顯文字，請框緊一點或改框對比清楚的文字。', false);
                return;
            }
            const rowThresh = Math.max(1, maxRow * 0.18);

            // 找出連續的「有筆畫」高度區帶（每帶≈一行文字）
            const bands = [];
            let start = -1;
            for (let ry = 0; ry < bh; ry++) {
                const ink = rowCounts[ry] >= rowThresh;
                if (ink && start === -1) start = ry;
                else if (!ink && start !== -1) { bands.push([start, ry - 1]); start = -1; }
            }
            if (start !== -1) bands.push([start, bh - 1]);
            const heights = bands.map(b => b[1] - b[0] + 1).filter(h => h >= 3);
            if (heights.length === 0) { showDetectResult('文字太小或太淡，無法判斷。', false); return; }

            heights.sort((a, b) => a - b);
            const medianH = heights[Math.floor(heights.length / 2)];

            // 取最接近中位數的區帶作為示意框
            let repBand = bands[0], best = Infinity;
            bands.forEach(b => {
                const h = b[1] - b[0] + 1;
                if (Math.abs(h - medianH) < best) { best = Math.abs(h - medianH); repBand = b; }
            });

            const estSize = Math.round(medianH);
            fontSizeEl.value = estSize;
            updateFontPreview();

            // 在畫布上標示量到的高度區帶（短暫顯示）
            detectionOverlay = {
                x: bx, y: by + repBand[0],
                w: bw, h: repBand[1] - repBand[0] + 1,
                size: estSize
            };
            redrawCanvas();
            if (detectionTimer) clearTimeout(detectionTimer);
            detectionTimer = setTimeout(() => { detectionOverlay = null; redrawCanvas(); }, 3000);

            const lineWord = bands.length > 1 ? `（偵測到約 ${bands.length} 行，取中位數）` : '';
            showDetectResult(`偵測完成：字高約 ${estSize}px，已填入字體大小 ${lineWord}。中文字此值≈字級；若是英數字可再放大約 1.3 倍。`);
        }

        detectSizeBtn.addEventListener('click', detectFontSize);

        eraseBtn.addEventListener('click', () => {
            if (!baseImageData) return alert('請先上傳圖片！');
            if (!selectionBox || selectionBox.w === 0) return alert('請先在圖片上「按住滑鼠拖曳」框出範圍！');
            saveState();
            ctx.putImageData(baseImageData, 0, 0);
            ctx.fillStyle = document.getElementById('bgColor').value;
            ctx.fillRect(selectionBox.x - 2, selectionBox.y - 2, selectionBox.w + 4, selectionBox.h + 4);
            baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            selectionBox = null;
            redrawCanvas();
            const orig = eraseBtn.innerHTML;
            eraseBtn.innerHTML = '✅ 已消除';
            setTimeout(() => { eraseBtn.innerHTML = orig; }, 1500);
        });

        applyTextBtn.addEventListener('click', () => {
            if (!baseImageData) return alert('請先上傳圖片！');
            if (!selectionBox || selectionBox.w === 0) return alert('請先框選一個大致的文字放置範圍！');
            saveState();
            const text = newTextEl.value;
            const fontSize = parseInt(fontSizeEl.value);
            const fontFamily = fontFamilyEl.value;
            const isBold = fontBoldEl.checked;
            const lines = text.split('\n');
            const lineHeight = fontSize * 1.6;
            const totalTextHeight = lines.length * lineHeight;
            ctx.font = `${isBold ? 'bold' : 'normal'} ${fontSize}px ${fontFamily}`;
            let maxWidth = 0;
            lines.forEach(line => {
                const w = ctx.measureText(line).width;
                if (w > maxWidth) maxWidth = w;
            });
            let startTextY = selectionBox.y + (selectionBox.h - totalTextHeight) / 2;
            if (startTextY < selectionBox.y) startTextY = selectionBox.y + 10;
            const startTextX = selectionBox.x + (selectionBox.w * 0.05);

            textObjects.push({
                lines,
                x: startTextX,
                y: startTextY,
                width: maxWidth,
                height: totalTextHeight,
                fontSize,
                fontFamily,
                bold: isBold,
                color: selectedColor
            });

            selectionBox = null;
            redrawCanvas();
            const orig = applyTextBtn.innerHTML;
            applyTextBtn.innerHTML = '✅ 新增成功';
            setTimeout(() => { applyTextBtn.innerHTML = orig; }, 1500);
        });

        undoBtn.addEventListener('click', () => {
            if (actionHistory.length > 0) {
                const lastState = actionHistory.pop();
                baseImageData = lastState.imageData;
                textObjects = lastState.textObjects;
                selectionBox = null;
                draggingTextIndex = -1;
                redrawCanvas();
                if (actionHistory.length === 0) undoBtn.classList.add('hidden');
            }
        });

        downloadBtn.addEventListener('click', () => {
            const currentSelection = selectionBox;
            selectionBox = null;
            redrawCanvas();
            const link = document.createElement('a');
            link.download = '修改後_宣導海報.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            selectionBox = currentSelection;
            redrawCanvas();
        });

        // 初始化
        updateMagnifierSize();
        updateFontPreview();
    </script>
</body>
</html>
