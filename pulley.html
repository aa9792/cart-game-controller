<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港邊大力士：滑輪實驗模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#dcfce7 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .svg-element {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .rope {
            stroke: #94a3b8;
            stroke-width: 4;
            fill: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pulley-wheel {
            fill: #e2e8f0;
            stroke: #64748b;
            stroke-width: 6;
        }

        .pulley-inner {
            fill: #94a3b8;
        }

        .weight-box {
            fill: #f87171;
            stroke: #b91c1c;
            stroke-width: 3;
            rx: 8;
        }

        .spring-scale {
            fill: #38bdf8;
            stroke: #0284c7;
            stroke-width: 3;
            rx: 6;
        }

        .status-badge {
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* 學習單表格樣式 */
        table {
            border-collapse: collapse;
            width: 100%;
            height: 100%;
        }
        th, td {
            border: 2px solid #334155;
            padding: 0;
            text-align: center;
        }
        th {
            background-color: #f8fafc;
            padding: 8px 4px;
            font-weight: 600;
            color: #1e293b;
            font-size: 0.9rem;
        }
        td input {
            width: 100%;
            height: 100%;
            padding: 8px 4px;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }
        td input:focus {
            background-color: #fffbeb;
        }
        
        /* 按鈕長按效果 */
        .hold-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col p-2 md:p-3 text-slate-800 box-border overflow-hidden">

    <div class="w-full max-w-7xl mx-auto flex-1 flex flex-col min-h-0">
        <header class="shrink-0 mb-3 flex items-center justify-between bg-white p-3 md:px-5 rounded-2xl shadow-sm border border-green-100">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl md:text-2xl font-bold text-green-700">🏗️ 港邊大力士：模擬滑輪實驗</h1>
                <p class="text-sm text-slate-500 hidden md:block">尋找改變物體運動狀態的「臨界施力點」</p>
            </div>
            <div>
                <div id="global-status" class="status-badge px-3 py-1 rounded-full text-sm font-bold text-white bg-slate-400 shadow-inner">
                    靜止中
                </div>
            </div>
        </header>

        <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-3 md:gap-4">
            
            <!-- 左側：模擬器區域 -->
            <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                
                <!-- 控制面板 -->
                <div class="bg-slate-50 p-2 md:p-3 border-b border-slate-200 flex flex-wrap gap-2 justify-center shrink-0">
                    
                    <!-- 滑輪選擇 -->
                    <div class="flex bg-slate-200 p-1 rounded-lg w-full md:w-auto">
                        <button id="btn-movable" class="px-4 py-1 text-sm rounded-md font-bold text-slate-700 bg-white shadow-sm transition-all">動滑輪</button>
                        <button id="btn-fixed" class="px-4 py-1 text-sm rounded-md font-bold text-slate-500 hover:text-slate-700 transition-all">定滑輪</button>
                    </div>

                    <!-- 重量選擇 -->
                    <div class="flex items-center space-x-1 justify-center">
                        <span class="font-semibold text-slate-600 text-xs ml-2">物重：</span>
                        <button class="weight-btn bg-red-100 text-red-700 border-2 border-red-500 font-bold py-0.5 px-2 text-sm rounded-md" data-weight="20">20g</button>
                        <button class="weight-btn bg-slate-100 text-slate-500 border-2 border-transparent font-bold py-0.5 px-2 text-sm rounded-md" data-weight="50">50g</button>
                        <button class="weight-btn bg-slate-100 text-slate-500 border-2 border-transparent font-bold py-0.5 px-2 text-sm rounded-md" data-weight="100">100g</button>
                    </div>
                </div>

                <!-- SVG 畫布 -->
                <div class="relative bg-sky-50 flex-1 flex items-center justify-center min-h-0">
                    
                    <!-- 施力控制 UI -->
                    <div class="absolute bottom-2 right-2 flex flex-col items-end space-y-1 z-10 scale-90 md:scale-100 origin-bottom-right">
                        <div class="bg-white/90 px-3 py-1.5 rounded-lg shadow border border-slate-200 text-center mb-1">
                            <div class="text-[10px] text-slate-500 font-bold mb-0.5">目前施力</div>
                            <div class="text-2xl font-black text-sky-600 leading-none"><span id="force-display">0</span> <span class="text-sm">g</span></div>
                        </div>
                        <div class="flex space-x-1.5">
                            <button id="btn-zero" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg shadow transition-colors text-sm">
                                歸零
                            </button>
                            <button id="btn-pull" class="hold-btn bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors flex items-center select-none text-sm">
                                <span class="mr-1">長按施力</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <svg id="simulator-svg" viewBox="0 0 400 450" class="w-full h-full max-h-full">
                        <!-- 天花板 -->
                        <rect x="0" y="0" width="400" height="20" fill="#cbd5e1" />
                        <line x1="0" y1="20" x2="400" y2="20" stroke="#94a3b8" stroke-width="4" />
                        
                        <!-- 地板 -->
                        <rect x="0" y="420" width="400" height="30" fill="#94a3b8" />
                        
                        <!-- 動態群組：定滑輪模式 -->
                        <g id="group-fixed" class="svg-element" style="opacity: 0; display: none;">
                            <!-- 滑輪支架 -->
                            <rect x="195" y="20" width="10" height="30" fill="#64748b" />
                            <!-- 左側繩子 (連接物體) -->
                            <line id="fixed-rope-left" class="rope" x1="170" y1="60" x2="170" y2="350" />
                            <!-- 右側繩子 (連接彈簧秤) -->
                            <line id="fixed-rope-right" class="rope" x1="230" y1="60" x2="230" y2="200" />
                            <!-- 跨越滑輪的繩子 -->
                            <path class="rope" d="M 170 60 A 30 30 0 0 1 230 60" />
                            
                            <!-- 定滑輪 -->
                            <circle cx="200" cy="60" r="30" class="pulley-wheel" />
                            <circle cx="200" cy="60" r="10" class="pulley-inner" />
                            
                            <!-- 物體 -->
                            <g id="fixed-object" class="svg-element" transform="translate(135, 350)">
                                <rect x="0" y="0" width="70" height="70" class="weight-box" />
                                <text x="35" y="42" text-anchor="middle" fill="white" font-weight="bold" font-size="20" class="obj-weight-text">20g</text>
                            </g>
                            
                            <!-- 彈簧秤 (施力端，往下拉) -->
                            <g id="fixed-scale" class="svg-element" transform="translate(205, 200)">
                                <rect x="0" y="0" width="50" height="100" class="spring-scale" />
                                <rect x="10" y="20" width="30" height="60" fill="white" rx="4" />
                                <text x="25" y="55" text-anchor="middle" fill="#0284c7" font-weight="bold" font-size="16" class="scale-text">0g</text>
                                <!-- 箭頭指示向下 -->
                                <path d="M 25 110 L 25 140 M 15 130 L 25 140 L 35 130" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        </g>

                        <!-- 動態群組：動滑輪模式 -->
                        <g id="group-movable" class="svg-element" style="opacity: 1;">
                            <!-- 繩子固定端 (天花板) -->
                            <line id="movable-rope-left" class="rope" x1="150" y1="20" x2="150" y2="300" />
                            <!-- 繩子活動端 (連接彈簧秤，往上拉) -->
                            <line id="movable-rope-right" class="rope" x1="210" y1="300" x2="210" y2="150" />
                            <!-- 跨越滑輪底部的繩子 -->
                            <path id="movable-rope-bottom" class="rope" d="M 150 300 A 30 30 0 0 0 210 300" />
                            
                            <!-- 動滑輪與物體 (會一起上下移動) -->
                            <g id="movable-assembly" class="svg-element" transform="translate(0, 300)">
                                <!-- 動滑輪 -->
                                <circle cx="180" cy="0" r="30" class="pulley-wheel" />
                                <circle cx="180" cy="0" r="10" class="pulley-inner" />
                                <!-- 連接物體的掛鉤 -->
                                <line x1="180" y1="30" x2="180" y2="50" stroke="#64748b" stroke-width="6" />
                                <!-- 物體 -->
                                <rect x="145" y="50" width="70" height="70" class="weight-box" />
                                <text x="180" y="92" text-anchor="middle" fill="white" font-weight="bold" font-size="20" class="obj-weight-text">20g</text>
                            </g>

                            <!-- 彈簧秤 (施力端，往上拉) -->
                            <g id="movable-scale" class="svg-element" transform="translate(185, 50)">
                                <rect x="0" y="0" width="50" height="100" class="spring-scale" />
                                <rect x="10" y="20" width="30" height="60" fill="white" rx="4" />
                                <text x="25" y="55" text-anchor="middle" fill="#0284c7" font-weight="bold" font-size="16" class="scale-text">0g</text>
                                <!-- 箭頭指示向上 -->
                                <path d="M 25 -10 L 25 -40 M 15 -30 L 25 -40 L 35 -30" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- 右側：學習單紀錄表 -->
            <div class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-3 md:p-4 flex flex-col h-full overflow-hidden">
                <div class="flex items-center mb-2 shrink-0">
                    <img src="https://api.iconify.design/noto:clipboard.svg" alt="clipboard" class="w-6 h-6 mr-2">
                    <h2 class="text-lg md:text-xl font-bold text-slate-800">觀察與紀錄</h2>
                </div>
                
                <div class="space-y-1 text-slate-600 mb-2 shrink-0 text-xs md:text-sm">
                    <p><span class="bg-amber-100 text-amber-800 px-1 py-0.5 rounded mr-1">實驗一</span>物重20g，在施力為10g、20g、30g時，記錄滑輪運動情形。</p>
                    <p><span class="bg-amber-100 text-amber-800 px-1 py-0.5 rounded mr-1">實驗二</span>物重50g、100g時，找出改變滑輪運動狀態的臨界施力。</p>
                </div>

                <div class="overflow-auto flex-1 min-h-0 border border-slate-200 rounded-lg">
                    <table class="w-full h-full text-sm">
                        <thead>
                            <tr>
                                <th class="w-1/6 bg-slate-100 text-slate-700">物體重量</th>
                                <th colspan="3" class="w-3/6 text-lg font-bold text-red-600 bg-red-50">20g</th>
                                <th class="w-1/6 text-lg font-bold text-slate-700 bg-slate-50">50g</th>
                                <th class="w-1/6 text-lg font-bold text-slate-700 bg-slate-50">100g</th>
                            </tr>
                            <tr>
                                <th class="bg-slate-100 text-slate-700">施力</th>
                                <th class="w-1/6 bg-red-50">10g</th>
                                <th class="w-1/6 bg-red-50">20g</th>
                                <th class="w-1/6 bg-red-50">30g</th>
                                <th class="bg-slate-50 text-xs text-slate-400 font-normal">填入臨界施力</th>
                                <th class="bg-slate-50 text-xs text-slate-400 font-normal">填入臨界施力</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th class="bg-slate-100 text-slate-700">動滑輪</th>
                                <td><input type="text" placeholder="不動/上升"></td>
                                <td><input type="text" placeholder="不動/上升"></td>
                                <td><input type="text" placeholder="不動/上升"></td>
                                <td><input type="text" placeholder="? g" class="font-bold text-blue-600"></td>
                                <td><input type="text" placeholder="? g" class="font-bold text-blue-600"></td>
                            </tr>
                            <tr>
                                <th class="bg-slate-100 text-slate-700">定滑輪</th>
                                <td><input type="text" placeholder="不動/上升"></td>
                                <td><input type="text" placeholder="不動/上升"></td>
                                <td><input type="text" placeholder="不動/上升"></td>
                                <td><input type="text" placeholder="? g" class="font-bold text-blue-600"></td>
                                <td><input type="text" placeholder="? g" class="font-bold text-blue-600"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="shrink-0 mt-3 border-t-2 border-slate-100 pt-3">
                    <label class="block text-sm font-bold text-slate-700 mb-1">我們發現：</label>
                    <textarea class="w-full h-16 md:h-20 p-2 rounded-lg border border-slate-200 focus:border-sky-400 focus:ring-2 focus:ring-sky-100 outline-none transition-all resize-none text-sm" placeholder="請歸納動滑輪與定滑輪在「施力」與「物重」之間的關係..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 狀態變數
        let mode = 'movable'; // 'movable' 或 'fixed'
        let weight = 20;      // 20, 50, 100
        let currentForce = 0; // 目前施力
        let requiredForce = 10; // 臨界施力點
        let isLifted = false;
        
        let forceInterval = null;

        // DOM 元素
        const btnMovable = document.getElementById('btn-movable');
        const btnFixed = document.getElementById('btn-fixed');
        const weightBtns = document.querySelectorAll('.weight-btn');
        const forceDisplay = document.getElementById('force-display');
        const btnPull = document.getElementById('btn-pull');
        const btnZero = document.getElementById('btn-zero');
        
        const groupFixed = document.getElementById('group-fixed');
        const groupMovable = document.getElementById('group-movable');
        const objWeightTexts = document.querySelectorAll('.obj-weight-text');
        const scaleTexts = document.querySelectorAll('.scale-text');
        
        const globalStatus = document.getElementById('global-status');

        // SVG 動畫元素
        // Fixed Mode
        const fixedObject = document.getElementById('fixed-object');
        const fixedScale = document.getElementById('fixed-scale');
        const fixedRopeLeft = document.getElementById('fixed-rope-left');
        const fixedRopeRight = document.getElementById('fixed-rope-right');
        
        // Movable Mode
        const movableAssembly = document.getElementById('movable-assembly');
        const movableScale = document.getElementById('movable-scale');
        const movableRopeLeft = document.getElementById('movable-rope-left');
        const movableRopeRight = document.getElementById('movable-rope-right');
        const movableRopeBottom = document.getElementById('movable-rope-bottom');

        // 座標常數 (Ground and Lifted)
        const POS = {
            fixed: {
                objGround: 350,
                objLifted: 150,
                scaleZero: 200,
                scaleMaxPull: 320 // 向下拉
            },
            movable: {
                assemblyGround: 300,
                assemblyLifted: 150,
                scaleZero: 50,
                scaleMaxPull: -50 // 向上拉
            }
        };

        // 初始化
        function init() {
            setMode('movable');
            setWeight(20);
            updatePhysics();
            
            // 綁定事件
            btnMovable.addEventListener('click', () => setMode('movable'));
            btnFixed.addEventListener('click', () => setMode('fixed'));
            
            weightBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    setWeight(parseInt(e.target.dataset.weight));
                });
            });

            // 連續施力按鈕 (支援滑鼠與觸控)
            const startPulling = (e) => {
                if(e) e.preventDefault();
                if (forceInterval) return;
                forceInterval = setInterval(() => {
                    // 設定最大施力上限，依據重量而定 (給予足夠的餘裕讓學生拉過頭)
                    let maxForce = weight === 100 ? 120 : (weight === 50 ? 70 : 40);
                    if (currentForce < maxForce) {
                        currentForce += 1; // 每次遞增 1g
                        updatePhysics();
                    }
                }, 40); // 40毫秒 +1g => 1秒 +25g，速度適中，方便觀察臨界點
            };

            const stopPulling = (e) => {
                if(e) e.preventDefault();
                if (forceInterval) {
                    clearInterval(forceInterval);
                    forceInterval = null;
                }
            };

            btnPull.addEventListener('mousedown', startPulling);
            btnPull.addEventListener('touchstart', startPulling);
            
            window.addEventListener('mouseup', stopPulling);
            window.addEventListener('touchend', stopPulling);

            // 歸零按鈕
            btnZero.addEventListener('click', () => {
                currentForce = 0;
                updatePhysics();
            });
        }

        // 切換模式 (動滑輪/定滑輪)
        function setMode(newMode) {
            mode = newMode;
            currentForce = 0;
            
            // UI 更新
            if (mode === 'movable') {
                btnMovable.className = "flex-1 py-2 rounded-lg font-bold text-sky-700 bg-white shadow-sm transition-all border-2 border-sky-400";
                btnFixed.className = "flex-1 py-2 rounded-lg font-bold text-slate-500 hover:text-slate-700 transition-all border-2 border-transparent";
                groupFixed.style.display = 'none';
                setTimeout(() => { groupFixed.style.opacity = 0; groupMovable.style.display = 'block'; }, 50);
                setTimeout(() => groupMovable.style.opacity = 1, 100);
            } else {
                btnFixed.className = "flex-1 py-2 rounded-lg font-bold text-sky-700 bg-white shadow-sm transition-all border-2 border-sky-400";
                btnMovable.className = "flex-1 py-2 rounded-lg font-bold text-slate-500 hover:text-slate-700 transition-all border-2 border-transparent";
                groupMovable.style.display = 'none';
                setTimeout(() => { groupMovable.style.opacity = 0; groupFixed.style.display = 'block'; }, 50);
                setTimeout(() => groupFixed.style.opacity = 1, 100);
            }
            
            calculateRequiredForce();
            updatePhysics();
        }

        // 切換重量
        function setWeight(newWeight) {
            weight = newWeight;
            currentForce = 0;
            
            weightBtns.forEach(btn => {
                if (parseInt(btn.dataset.weight) === weight) {
                    btn.className = "weight-btn bg-red-100 text-red-700 border-2 border-red-500 font-bold py-1 px-3 rounded-lg transition-all";
                } else {
                    btn.className = "weight-btn bg-slate-100 text-slate-500 border-2 border-transparent hover:bg-slate-200 font-bold py-1 px-3 rounded-lg transition-all";
                }
            });

            objWeightTexts.forEach(t => t.textContent = weight + 'g');
            calculateRequiredForce();
            updatePhysics();
        }

        // 計算臨界施力
        function calculateRequiredForce() {
            if (mode === 'fixed') {
                requiredForce = weight; // 定滑輪不省力
            } else {
                requiredForce = weight / 2; // 動滑輪省一半力
            }
        }

        // 核心物理與動畫更新
        function updatePhysics() {
            forceDisplay.textContent = currentForce;
            scaleTexts.forEach(t => t.textContent = currentForce + 'g');
            
            // 判斷是否成功拉起
            isLifted = currentForce >= requiredForce;

            // 更新狀態徽章
            if (currentForce === 0) {
                globalStatus.textContent = "請長按施力";
                globalStatus.className = "status-badge px-4 py-2 rounded-full font-bold text-slate-600 bg-slate-200 shadow-inner";
            } else if (isLifted) {
                globalStatus.textContent = "物體上升中！";
                globalStatus.className = "status-badge px-4 py-2 rounded-full font-bold text-white bg-green-500 shadow-md transform scale-110";
            } else {
                globalStatus.textContent = "靜止不動";
                globalStatus.className = "status-badge px-4 py-2 rounded-full font-bold text-white bg-amber-500 shadow-md";
            }

            // 更新 SVG 動畫位置
            if (mode === 'fixed') {
                // 定滑輪動畫邏輯
                let objY = isLifted ? POS.fixed.objLifted : POS.fixed.objGround;
                
                // 彈簧秤隨施力往下移動 (模擬手拉)
                // 為了視覺效果，即使沒拉起來彈簧秤也會有些微拉伸，拉起來後位移更大
                let scaleY = POS.fixed.scaleZero;
                if (!isLifted) {
                    scaleY += (currentForce / requiredForce) * 20; // 輕微拉緊
                } else {
                    scaleY += 20 + ((currentForce - requiredForce) * 1.5); // 拉起後繼續往下
                }
                // 限制最大拉動範圍
                scaleY = Math.min(scaleY, POS.fixed.scaleMaxPull);

                // 若施力超過臨界，繩子必須連動以維持長度一致 (理想狀態)
                if(isLifted) {
                     // 簡化視覺：一旦舉起，彈簧秤與物體呈現相對應的高低落差
                     scaleY = POS.fixed.scaleZero + (POS.fixed.objGround - objY);
                }

                fixedObject.setAttribute('transform', `translate(135, ${objY})`);
                fixedRopeLeft.setAttribute('y2', objY);
                
                fixedScale.setAttribute('transform', `translate(205, ${scaleY})`);
                fixedRopeRight.setAttribute('y2', scaleY);
                
            } else {
                // 動滑輪動畫邏輯
                let asmY = isLifted ? POS.movable.assemblyLifted : POS.movable.assemblyGround;
                
                // 彈簧秤隨施力往上拉
                let scaleY = POS.movable.scaleZero;
                if (!isLifted) {
                    scaleY -= (currentForce / requiredForce) * 10;
                } else {
                    scaleY -= 10 + ((currentForce - requiredForce) * 1.5);
                }
                scaleY = Math.max(scaleY, POS.movable.scaleMaxPull);

                if(isLifted) {
                    // 動滑輪特性：物體上升 h，繩子需拉 2h
                    let liftDist = POS.movable.assemblyGround - asmY;
                    scaleY = POS.movable.scaleZero - (liftDist * 2);
                    // 防止超出畫面
                    scaleY = Math.max(scaleY, -80); 
                }

                movableAssembly.setAttribute('transform', `translate(0, ${asmY})`);
                
                // 動滑輪兩側繩子會隨滑輪高度改變
                movableRopeLeft.setAttribute('y2', asmY);
                movableRopeRight.setAttribute('y1', asmY);
                
                // 更新跨越滑輪底部的弧線
                movableRopeBottom.setAttribute('d', `M 150 ${asmY} A 30 30 0 0 0 210 ${asmY}`);

                // 彈簧秤位置
                movableScale.setAttribute('transform', `translate(185, ${scaleY})`);
                movableRopeRight.setAttribute('y2', scaleY);
            }
        }

        // 啟動應用
        window.onload = init;
    </script>
</body>
</html>
