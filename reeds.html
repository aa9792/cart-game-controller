    const normalizeRatios = (ratios) => {
      const keys = Object.keys(ratios);
      const sum = keys.reduce((acc, k) => acc + (toNumber(ratios[k], 0)), 0);
      if (sum <= 0) return ratios;
      const scaled = {};
      let running = 0;
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (i === keys.length - 1) { scaled[k] = 100 - running; }
        else { const v = Math.round((ratios[k] / sum) * 100); scaled[k] = v; running += v; }
      }
      return scaled;
    };

    const calcFinancial = (params) => {
      const { studentCount, termMonths, tuitionFeeTerm, incomeRatio, autoNormalizeRatio, benefitFactor, salaryTiers, rentMonthly, fixedOtherTerm, materialPerStudentTerm, activityPerStudentTerm, provideMeals, mealCostPerStudentPerMonth } = params;
      const ratioSum = Object.values(incomeRatio).reduce((a, b) => a + toNumber(b, 0), 0);
      const ratios = autoNormalizeRatio ? normalizeRatios(incomeRatio) : incomeRatio;
      const tuitionIncome = studentCount * tuitionFeeTerm;
      const tuitionPct = clamp(toNumber(ratios.tuition, 0), 0, 100);
      const totalIncome = tuitionPct > 0 ? Math.round(tuitionIncome / (tuitionPct / 100)) : 0;
      const incomeParts = {
        tuition: Math.round(totalIncome * (toNumber(ratios.tuition, 0) / 100)),
        subsidy: Math.round(totalIncome * (toNumber(ratios.subsidy, 0) / 100)),
        donation: Math.round(totalIncome * (toNumber(ratios.donation, 0) / 100)),
        afterSchool: 0
      };
      incomeParts.afterSchool = totalIncome - (incomeParts.tuition + incomeParts.subsidy + incomeParts.donation);
      const personnelBaseMonthly = salaryTiers.reduce((acc, t) => acc + (toNumber(t.count, 0) * toNumber(t.monthlySalary, 0)), 0);
      const personnelCost = Math.round(personnelBaseMonthly * termMonths * benefitFactor);
      const rentCost = Math.round(rentMonthly * termMonths);
      const mealCost = provideMeals ? Math.round(studentCount * mealCostPerStudentPerMonth * termMonths) : 0;
      const materialCost = Math.round(studentCount * materialPerStudentTerm);
      const activityCost = Math.round(studentCount * activityPerStudentTerm);
      const otherOpCost = Math.round(fixedOtherTerm + materialCost + activityCost);
      const operationCost = rentCost + mealCost + otherOpCost;
      const totalExpense = personnelCost + operationCost;
      const netProfit = totalIncome - totalExpense;
      const costPerStudent = Math.round(totalExpense / Math.max(studentCount, 1));
      const profitMargin = totalIncome > 0 ? Math.round((netProfit / totalIncome) * 100) : 0;
      const incomePerStudentTotal = tuitionPct > 0 ? (tuitionFeeTerm / (tuitionPct / 100)) : 0;
      const breakEvenStudents = incomePerStudentTotal > 0 ? Math.ceil(totalExpense / incomePerStudentTotal) : 0;
      const incomePie = [
        { name: "學費", value: incomeParts.tuition },
        { name: "政府/補助", value: incomeParts.subsidy },
        { name: "捐款", value: incomeParts.donation },
        { name: "課後/其他", value: incomeParts.afterSchool }
      ];
      const expensePie = [
        { name: "人事成本", value: personnelCost },
        { name: "租金", value: rentCost },
        { name: "供餐", value: mealCost },
        { name: "其他營運", value: otherOpCost }
      ];
      const barData = [{ name: "本學期", 總收入: totalIncome, 總支出: totalExpense }];
      return { ratioSum, ratios, totalIncome, tuitionIncome, incomeParts, totalExpense, netProfit, personnelCost, rentCost, mealCost, otherOpCost, operationCost, costPerStudent, profitMargin, breakEvenStudents, incomePie, expensePie, barData };
    };

                    <SectionTitle icon={Users} title="人事成本（分層薪資）" hint="可新增職務列" />
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">福利/雇主係數</label>
                        <input type="number" step="0.05" name="benefitFactor" value={params.benefitFactor} onChange={updateNumber}
                          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                        <div className="text-[11px] text-slate-500 mt-1">建議 1.1～1.3（含勞健保/提撥/年終）</div>
                      </div>
                      <div className="flex items-end justify-end">
                        <button onClick={addTier} className="flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-black hover:bg-indigo-700">
                          <Plus size={16} /> 新增職務
                        </button>
                      </div>
                    </div>
                    <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white">
                      <table className="w-full text-sm">
                        <thead className="bg-slate-100 text-slate-700">
                          <tr>
                            <th className="p-3 text-left font-black">職務</th>
                            <th className="p-3 text-right font-black">人數</th>
                            <th className="p-3 text-right font-black">月薪</th>
                            <th className="p-3 text-right font-black">操作</th>
                          </tr>
                        </thead>
                        <tbody>
                          {params.salaryTiers.map((t, idx) => (
                            <tr key={idx} className="border-t border-slate-200 hover:bg-slate-50">
                              <td className="p-3">
                                <input value={t.role} onChange={(e) => updateTier(idx, "role", e.target.value)}
                                  className="w-full border border-slate-200 rounded-lg px-2 py-1 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                              </td>
                              <td className="p-3 text-right">
                                <input type="number" value={t.count} onChange={(e) => updateTier(idx, "count", toNumber(e.target.value, 0))}
                                  className="w-24 text-right border border-slate-200 rounded-lg px-2 py-1 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                              </td>
                              <td className="p-3 text-right">
                                <input type="number" value={t.monthlySalary} onChange={(e) => updateTier(idx, "monthlySalary", toNumber(e.target.value, 0))}
                                  className="w-32 text-right border border-slate-200 rounded-lg px-2 py-1 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                              </td>
                              <td className="p-3 text-right">
                                <button onClick={() => removeTier(idx)}
                                  className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 font-black hover:bg-rose-100">
                                  <Trash2 size={14} /> 刪除
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="pt-2 border-t border-slate-200"></div>
                    <SectionTitle icon={Building2} title="營運成本" hint="租金以月租×學期月數，教材/活動以每生計算" />
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">每月租金</label>
                        <input type="number" name="rentMonthly" value={params.rentMonthly} onChange={updateNumber}
                          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500" />
                      </div>
                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">其他固定成本（學期）</label>
                        <input type="number" name="fixedOtherTerm" value={params.fixedOtherTerm} onChange={updateNumber}
                          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500" />
                        <div className="text-[11px] text-slate-500 mt-1">例：水電、系統、保全、清潔、修繕</div>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">教材費（每生/學期）</label>
                        <input type="number" name="materialPerStudentTerm" value={params.materialPerStudentTerm} onChange={updateNumber}
                          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500" />
                      </div>
                      <div>
                        <label className="block text-xs font-black text-slate-700 mb-1">活動費（每生/學期）</label>
                        <input type="number" name="activityPerStudentTerm" value={params.activityPerStudentTerm} onChange={updateNumber}
                          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500" />
                      </div>
                    </div>

                    <div className="pt-2 border-t border-slate-200"></div>
                    <SectionTitle icon={UtensilsCrossed} title="供餐設定" hint="勾選後自動計算：每生每月餐費×學期月數×學生數" />
                    <div className="flex items-center justify-between gap-3 bg-white border border-slate-200 rounded-xl p-4">
                      <label className="flex items-center gap-2 font-black text-slate-700">
                        <input type="checkbox" checked={params.provideMeals} onChange={(e) => update("provideMeals", e.target.checked)} className="accent-emerald-600" />
                        本校是否供餐
                      </label>
                      <div className={cn("flex items-center gap-2", !params.provideMeals && "opacity-40 pointer-events-none")}>
                        <span className="text-xs font-black text-slate-600">每生每月餐費</span>
                        <input type="number" name="mealCostPerStudentPerMonth" value={params.mealCostPerStudentPerMonth} onChange={updateNumber}
                          className="w-32 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500 text-right" />
                      </div>
                    </div>
                  </div>

                  {/* 右：結果區 */}
                  <div className="lg:col-span-7 space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <KpiCard title="預估總收入 (學期)" value={formatMoney(data.totalIncome)} icon={TrendingUp} tone="emerald" sub={`學費占比：${data.ratios.tuition}%`} />
                      <KpiCard title="預估總支出 (學期)" value={formatMoney(data.totalExpense)} icon={TrendingDown} tone="rose" sub={`人事：${formatMoney(data.personnelCost)}`} />
                      <KpiCard title="淨損益 (學期)" value={formatMoney(data.netProfit)} icon={Activity} tone={data.netProfit >= 0 ? "indigo" : "red"} sub={`獲利率：${data.profitMargin}%`} />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <KpiCard title="生均成本" value={formatMoney(data.costPerStudent)} icon={Users} tone="sky" sub="總支出 ÷ 學生數" />
                      <KpiCard title="損益平衡學生數" value={`${data.breakEvenStudents} 人`} icon={Calculator} tone="indigo" sub="達到收支平衡" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-[460px] md:h-96">
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                        <h4 className="text-sm font-black text-slate-700 mb-3 text-center">學期收支對比</h4>
                        <div className="flex-1 w-full min-h-0">
                          <ResponsiveContainer width="100%" height="100%">
                            <BarChart data={data.barData} margin={{ top: 20, right: 20, left: 5, bottom: 5 }}>
                              <CartesianGrid strokeDasharray="3 3" vertical={false} />
                              <XAxis dataKey="name" />
                              <YAxis tickFormatter={(v) => `${Math.round(v / 10000)}萬`} width={52} fontSize={12} />
                              <Tooltip formatter={(v) => formatMoney(v)} />
                              <Legend />
                              <Bar dataKey="總收入" fill="#10b981" barSize={42} radius={[6, 6, 0, 0]} />
                              <Bar dataKey="總支出" fill="#f43f5e" barSize={42} radius={[6, 6, 0, 0]} />
                            </BarChart>
                          </ResponsiveContainer>
                        </div>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                        <h4 className="text-sm font-black text-slate-700 mb-3 text-center">支出結構</h4>
                        <div className="flex-1 w-full min-h-0">
                          <ResponsiveContainer width="100%" height="100%">
                            <PieChart>
                              <Pie data={data.expensePie} dataKey="value" cx="50%" cy="50%" innerRadius={55} outerRadius={85} paddingAngle={4}>
                                {data.expensePie.map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                              </Pie>
                              <Tooltip formatter={(v) => formatMoney(v)} />
                              <Legend verticalAlign="bottom" height={36} iconType="circle" />
                            </PieChart>
                          </ResponsiveContainer>
                        </div>
                      </div>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <h4 className="text-sm font-black text-slate-700 mb-3 text-center">收入來源結構（依占比拆分）</h4>
                      <div className="h-80">
                        <ResponsiveContainer width="100%" height="100%">
                          <PieChart>
                            <Pie data={data.incomePie} dataKey="value" cx="50%" cy="45%" innerRadius={55} outerRadius={90} paddingAngle={4}>
                              {data.incomePie.map((_, i) => <Cell key={i} fill={COLORS[(i + 2) % COLORS.length]} />)}
                            </Pie>
                            <Tooltip formatter={(v) => formatMoney(v)} />
                            <Legend verticalAlign="bottom" height={36} iconType="circle" />
                          </PieChart>
                        </ResponsiveContainer>
                      </div>
                    </div>
                    <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4">
                      <h4 className="font-black text-slate-700 mb-3 flex items-center gap-2 text-sm"><Info size={16} className="text-indigo-500" /> 計算邏輯（透明可調）</h4>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-slate-600">
                        <div className="bg-white border border-slate-200 rounded-xl p-3">
                          <div className="font-black text-slate-700 mb-1">總收入（學期）</div>
                          <div className="font-mono text-slate-500">學費收入 ÷ (學費占比)</div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-3">
                          <div className="font-black text-slate-700 mb-1">人事成本（學期）</div>
                          <div className="font-mono text-slate-500">Σ(人數×月薪) × 月數 × 福利係數</div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-3">
                          <div className="font-black text-slate-700 mb-1">租金</div>
                          <div className="font-mono text-slate-500">月租 × 學期月數</div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-3">
                          <div className="font-black text-slate-700 mb-1">供餐（若勾選）</div>
                          <div className="font-mono text-slate-500">每生每月餐費 × 月數 × 學生數</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* =============== 班級課表 =============== */}
              {CLASS_SCHEDULES[activeTab] && <ClassScheduleTab activeTab={activeTab} />}

            </div>
          </div>
        </div>
      );
    };

    try {
      const root = createRoot(document.getElementById("root"));
      root.render(<SchoolManagementApp />);
    } catch (err) {
      const el = document.getElementById("runtime-error");
      el.classList.remove("hidden");
      el.textContent = "🚨 Render Error: " + (err?.message || err);
      console.error(err);
    }
  </script>
</body>
</html>
