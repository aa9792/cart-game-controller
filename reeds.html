                                        <div className="bg-slate-50 p-6 rounded-xl border border-slate-100 shadow-inner">
                                            <h3 className="text-md font-bold text-slate-700 mb-4 flex items-center">
                                               <svg className="w-4 h-4 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 005.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                                教職員組成概況 (Personnel Composition)
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 hover:border-indigo-200 transition-colors">
                                                    <div className="text-xs text-slate-400 font-bold uppercase mb-1">校級領導</div>
                                                    <div className="text-2xl font-black text-slate-800">1 <span className="text-sm font-normal text-slate-500">位</span></div>
                                                    <div className="mt-2 text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded inline-block">每週授課：0 節</div>
                                                    <div className="text-[10px] text-indigo-600 font-medium mt-1">校長 (不授課)</div>
                                                </div>
                                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 hover:border-indigo-200 transition-colors">
                                                    <div className="text-xs text-slate-400 font-bold uppercase mb-1">處室主任</div>
                                                    <div className="text-2xl font-black text-indigo-600">3 <span className="text-sm font-normal text-slate-500">位</span></div>
                                                    <div className="mt-2 text-[11px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded inline-block font-bold">每週授課：2 節 / 人</div>
                                                    <div className="text-[10px] text-slate-500 mt-1">教導(副校長)、學輔、總務</div>
                                                </div>
                                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 hover:border-indigo-200 transition-colors">
                                                    <div className="text-xs text-slate-400 font-bold uppercase mb-1">行政組長 / 教學</div>
                                                    <div className="text-2xl font-black text-indigo-600">4 <span className="text-sm font-normal text-slate-500">位</span></div>
                                                    <div className="mt-2 text-[11px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded inline-block font-bold">每週授課：8.5 節 / 人</div>
                                                    <div className="text-[10px] text-slate-500 mt-1">教研、生教、註冊、資管</div>
                                                </div>
                                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 hover:border-emerald-200 transition-colors">
                                                    <div className="text-xs text-slate-400 font-bold uppercase mb-1">外師教學團隊</div>
                                                    <div className="text-2xl font-black text-emerald-600">7 <span className="text-sm font-normal text-slate-500">位</span></div>
                                                    <div className="mt-2 text-[11px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded inline-block font-bold">每週授課：12-15 節 / 人</div>
                                                    <div className="text-[10px] text-slate-500 mt-1">4 班導師 + 3 兼任教師</div>
                                                </div>
                                            </div>
                                            <div className="mt-4 p-3 bg-white/50 rounded-lg text-xs text-slate-500 leading-relaxed border border-dashed border-slate-200 text-center">
                                                <span className="font-bold text-indigo-700">教學總能量：</span> 每週共計消化 <span className="font-bold text-indigo-900">140 節</span> 課程 (中外師協力完成) | <span className="font-bold">編制總額 21 位 (含護理師)</span>
                                            </div>
                                        </div>
                                    </section>

                                    <section>
                                        <div className="flex items-center mb-6 text-xl font-bold text-slate-800">
                                            <div className="w-1.5 h-6 bg-indigo-600 mr-3 rounded-full"></div>
                                            二、 各處室詳細職掌與成員
                                        </div>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            {officeStaffData.map((office, idx) => (
                                                <div key={idx} className={`border rounded-xl overflow-hidden border-${office.color}-100 shadow-sm`}>
                                                    <div className={`bg-${office.color}-600 p-4 text-white`}>
                                                        <div className="text-lg font-bold">{office.office}</div>
                                                        <div className="text-xs mt-2 font-medium bg-white/20 inline-block px-2 py-1 rounded">主管：{office.dean}</div>
                                                    </div>
                                                    <div className="p-5 space-y-6">
                                                        {office.members.map((m, mIdx) => (
                                                            <div key={mIdx}>
                                                                <div className="flex justify-between items-center mb-2">
                                                                    <span className="font-bold text-slate-800 text-sm">{m.title}</span>
                                                                    <span className={`text-xs font-bold text-${office.color}-700 bg-${office.color}-50 px-2 py-1 rounded-md`}>{m.count} 位</span>
                                                                </div>
                                                                <p className="text-xs text-slate-500 leading-relaxed">{m.detail}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                </div>
                            )}

                            {activeTab === 'summary' && (
                                <div className="space-y-10">
                                    <section>
                                        <h2 className="text-lg font-bold mb-4 border-l-4 border-indigo-600 pl-3">教學配課精算 (14 師 / 140 節)</h2>
                                        <table className="w-full border-collapse text-sm border border-slate-100 mb-4">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-600 text-left">
                                                    <th className="border p-3">人員分類</th>
                                                    <th className="border p-3">代碼與科目</th>
                                                    <th className="border p-3 text-right">每人節數</th>
                                                    <th className="border p-3 text-right">小計</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr><td className="border p-3 font-semibold">中師主任 (3位)</td><td className="border p-3 text-slate-500">CT1-3 品德/閱讀/社會</td><td className="border p-3 text-right">2 節</td><td className="border p-3 text-right">6 節</td></tr>
                                                <tr><td className="border p-3 font-semibold">中師組長 (4位)</td><td className="border p-3 text-slate-500">CT4-7 國語/數學</td><td className="border p-3 text-right">8.5 節</td><td className="border p-3 text-right">34 節</td></tr>
                                                <tr className="bg-emerald-50/50"><td className="border p-3 font-semibold text-emerald-800">外師導師 (4位)</td><td className="border p-3 text-emerald-600">ET1-4 LA/Social/Science/部分探索</td><td className="border p-3 text-right">15 節</td><td className="border p-3 text-right">60 節</td></tr>
                                                <tr className="bg-emerald-50/50"><td className="border p-3 font-semibold text-emerald-800">外師兼任 (3位)</td><td className="border p-3 text-emerald-600">ET5-7 Arts/PE/部分探索</td><td className="border p-3 text-right">12 節</td><td className="border p-3 text-right">36 節</td></tr>
                                                <tr className="bg-slate-800 text-white font-bold"><td colSpan="3" className="border p-3 text-right">每週總授課量</td><td className="border p-3 text-right">140 節</td></tr>
                                            </tbody>
                                        </table>

                                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-4">
                                            <h4 className="text-sm font-bold text-slate-700 mb-2 flex items-center">
                                                <svg className="w-4 h-4 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                                教師代碼對照說明 (Code Legend)
                                            </h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                                <div className="space-y-1">
                                                    <div className="flex items-center">
                                                        <span className="w-12 font-mono font-bold text-indigo-700 bg-indigo-50 px-1 rounded mr-2">CT</span>
                                                        <span className="text-slate-600 font-medium">Chinese Teacher (中師)</span>
                                                    </div>
                                                    <ul className="pl-14 list-disc text-slate-500 space-y-0.5">
                                                        <li><span className="font-mono text-indigo-600">CT 1-3</span> : 處室主任 (兼任少量學科)</li>
                                                        <li><span className="font-mono text-indigo-600">CT 4-7</span> : 行政組長 (兼任國語/數學)</li>
                                                    </ul>
                                                </div>
                                                <div className="space-y-1">
                                                    <div className="flex items-center">
                                                        <span className="w-12 font-mono font-bold text-emerald-700 bg-emerald-50 px-1 rounded mr-2">ET</span>
                                                        <span className="text-slate-600 font-medium">English Teacher (外師)</span>
                                                    </div>
                                                    <ul className="pl-14 list-disc text-slate-500 space-y-0.5">
                                                        <li><span className="font-mono text-emerald-600">ET 1-4</span> : 班級導師 (LA/Social/Science/探索)</li>
                                                        <li><span className="font-mono text-emerald-600">ET 5-7</span> : 兼任教師 (Arts/PE/探索)</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </section>
                                    <section>
                                        <h2 className="text-lg font-bold mb-4 border-l-4 border-indigo-600 pl-3">每日作息時間 (40分鐘制)</h2>
                                        <table className="w-full border-collapse text-sm">
                                            <tbody>
                                                {timeTable.map((t, idx) => (
                                                    <tr key={idx} className={t.period.includes('休息') || t.period.includes('午餐') ? 'bg-amber-50/50' : ''}>
                                                        <td className="border p-2 font-bold text-slate-600 w-24">{t.period}</td>
                                                        <td className="border p-2 font-mono text-indigo-600 w-32">{t.time}</td>
                                                        <td className="border p-2 text-slate-500">{t.activity}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </section>
                                </div>
                            )}

                            {/* 5. 補全班級課表渲染邏輯 */}
                            {classSchedules[activeTab] && (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-slate-800 flex items-center">
                                            <span className="bg-indigo-600 text-white px-3 py-1 rounded mr-3 text-lg">{activeTab}</span>
                                            班級課表
                                        </h2>
                                        <div className="text-sm text-slate-500">
                                            導師：{activeTab.includes('1') ? '中師 + 外師 (ET1/ET2)' : '中師 + 外師 (ET3/ET4)'}
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full border-collapse text-sm text-center">
                                            <thead>
                                                <tr className="bg-slate-800 text-white">
                                                    <th className="border border-slate-700 p-3 w-20">節次</th>
                                                    {days.map(d => <th key={d} className="border border-slate-700 p-3 w-1/5">{d}</th>)}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {/* 這裡需要將 7行 x 5列 的數據渲染出來，並對應正確的節次 */}
                                                {classSchedules[activeTab].map((row, rowIdx) => {
                                                    // 找到對應的第幾節 (跳過晨間、午休等非授課時段)
                                                    const periodName = `第 ${rowIdx + 1} 節`;
                                                    // 從 timeTable 找時間
                                                    const timeInfo = timeTable.find(t => t.period === periodName);
                                                    
                                                    return (
                                                        <tr key={rowIdx} className="hover:bg-slate-50 transition-colors">
                                                            <td className="border p-2 bg-slate-100 font-bold text-slate-700">
                                                                <div>{periodName}</div>
                                                                <div className="text-[10px] font-mono text-slate-500 mt-1">{timeInfo ? timeInfo.time : ''}</div>
                                                            </td>
                                                            {row.map((subject, colIdx) => {
                                                                // 根據科目類型上色
                                                                let cellClass = "border p-3 ";
                                                                if (subject.includes('ET')) cellClass += "text-emerald-700 bg-emerald-50/30 font-medium";
                                                                else if (subject.includes('CT')) cellClass += "text-indigo-700 bg-indigo-50/30 font-medium";
                                                                else cellClass += "text-slate-600";
                                                                
                                                                return (
                                                                    <td key={colIdx} className={cellClass}>
                                                                        {subject}
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="text-xs text-slate-500 mt-4 text-right">
                                        * CT: 中師授課 | ET: 外師授課
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SchoolScheduleApp />);
    </script>
</body>
</html>
