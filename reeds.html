        const SchoolScheduleApp = () => {
            const [activeTab, setActiveTab] = useState('budget'); // 預設顯示預算頁

            // --- 財務模擬器 State ---
            // 預設參數：以一學期(6個月)為計算單位
            const [budgetParams, setBudgetParams] = useState({
                studentCount: 80,       // 學生數 (4班 x 20人)
                tuitionFee: 65000,      // 每人每學期學雜費收入
                staffCount: 21,         // 教職員工人數 (依據組織圖)
                avgMonthlySalary: 55000,// 平均月薪 (含勞健保/退休金提撥估算)
                fixedCost: 800000,      // 學期固定開銷 (水電/修繕/系統/保全)
                variableCost: 5000,     // 每生學期變動成本 (教材/餐費/活動)
            });

            // --- 財務計算邏輯 (useMemo) ---
            const financialData = useMemo(() => {
                const { studentCount, tuitionFee, staffCount, avgMonthlySalary, fixedCost, variableCost } = budgetParams;
                
                // 1. 收入
                const totalIncome = studentCount * tuitionFee;

                // 2. 支出
                // 人事費：人數 * 月薪 * 6個月 * 1.2 (約略含勞健保雇主負擔與年終攤提)
                const personnelCost = Math.round(staffCount * avgMonthlySalary * 6 * 1.2); 
                
                // 營運成本：固定成本 + (學生數 * 變動成本)
                const operationCost = fixedCost + (studentCount * variableCost);
                
                const totalExpense = personnelCost + operationCost;
                const netProfit = totalIncome - totalExpense;
                const costPerStudent = Math.round(totalExpense / (studentCount || 1));
                
                // 獲利率計算，避免除以零
                const profitMargin = totalIncome > 0 ? Math.round((netProfit / totalIncome) * 100) : 0;

                // 3. 圖表數據
                const pieData = [
                    { name: '人事成本', value: personnelCost },
                    { name: '營運雜支', value: operationCost },
                ];
                
                const barData = [
                    { name: '財務概況', 總收入: totalIncome, 總支出: totalExpense }
                ];

                return { totalIncome, totalExpense, netProfit, personnelCost, operationCost, costPerStudent, profitMargin, pieData, barData };
            }, [budgetParams]);

                setBudgetParams(prev => ({ ...prev, [name]: Number(value) }));

                                            </div>

                                            <div>
                                                <label className="flex justify-between text-sm font-bold text-slate-700 mb-2">
                                                    平均月薪成本 <span className="text-indigo-600">${budgetParams.avgMonthlySalary}</span>
                                                </label>
                                                <div className="relative">
                                                    <DollarSign size={14} className="absolute left-3 top-3 text-slate-400"/>
                                                    <input type="number" name="avgMonthlySalary" value={budgetParams.avgMonthlySalary} onChange={handleParamChange} className="w-full pl-8 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                                                </div>
                                                <p className="text-[10px] text-slate-400 mt-1">*含薪資、勞健保雇主負擔、退撫提撥估算</p>
                                            </div>

                                            <div className="border-t border-slate-200 pt-4 grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">
                                                        固定營運成本 (學期)
                                                    </label>
                                                    <input type="number" name="fixedCost" step="10000" value={budgetParams.fixedCost} onChange={handleParamChange} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm focus:ring-2 focus:ring-amber-500 outline-none"/>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">
                                                        生均變動成本 (學期)
                                                    </label>
                                                    <input type="number" name="variableCost" step="500" value={budgetParams.variableCost} onChange={handleParamChange} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm focus:ring-2 focus:ring-amber-500 outline-none"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 右側：視覺化儀表板 */}
                                    <div className="lg:col-span-8 space-y-6">
                                        {/* 關鍵指標卡片 */}
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div className="bg-emerald-50 p-5 rounded-xl border border-emerald-100 flex flex-col justify-between">
                                                <div className="flex justify-between items-start">
                                                    <div className="text-xs text-emerald-600 font-bold uppercase tracking-wider">預估總收入 (Income)</div>
                                                    <TrendingUp size={16} className="text-emerald-400"/>
                                                </div>
                                                <div className="text-2xl font-black text-emerald-700 mt-2">{formatMoney(financialData.totalIncome)}</div>
                                            </div>
                                            <div className="bg-rose-50 p-5 rounded-xl border border-rose-100 flex flex-col justify-between">
                                                <div className="flex justify-between items-start">
                                                    <div className="text-xs text-rose-600 font-bold uppercase tracking-wider">預估總支出 (Expense)</div>
                                                    <TrendingDown size={16} className="text-rose-400"/>
                                                </div>
                                                <div className="text-2xl font-black text-rose-700 mt-2">{formatMoney(financialData.totalExpense)}</div>
                                            </div>
                                            <div className={`p-5 rounded-xl border flex flex-col justify-between ${financialData.netProfit >= 0 ? 'bg-indigo-50 border-indigo-100' : 'bg-red-100 border-red-200'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div className={`text-xs font-bold uppercase tracking-wider ${financialData.netProfit >= 0 ? 'text-indigo-600' : 'text-red-600'}`}>
                                                        淨損益 (Net Profit)
                                                    </div>
                                                    <Activity size={16} className={financialData.netProfit >= 0 ? 'text-indigo-400' : 'text-red-400'}/>
                                                </div>
                                                <div>
                                                    <div className={`text-2xl font-black mt-2 ${financialData.netProfit >= 0 ? 'text-indigo-700' : 'text-red-700'}`}>
                                                        {formatMoney(financialData.netProfit)}
                                                    </div>
                                                    <div className="text-xs mt-1 font-bold opacity-70">
                                                        獲利率: {financialData.profitMargin}%
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* 圖表區 */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-[400px] md:h-80">
                                            {/* 收支長條圖 */}
                                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                                <h4 className="text-sm font-bold text-slate-700 mb-4 text-center">學期收支預測對比</h4>
                                                <div className="flex-1 w-full min-h-0">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <BarChart data={financialData.barData} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                                                            <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                            <XAxis dataKey="name" hide />
                                                            <YAxis tickFormatter={(val) => `${val/10000}萬`} width={40} fontSize={12} />
                                                            <Tooltip formatter={(value) => formatMoney(value)} cursor={{fill: 'transparent'}} />
                                                            <Legend />
                                                            <Bar dataKey="總收入" fill="#10b981" barSize={40} radius={[4, 4, 0, 0]} />
                                                            <Bar dataKey="總支出" fill="#f43f5e" barSize={40} radius={[4, 4, 0, 0]} />
                                                            <ReferenceLine y={financialData.totalIncome} stroke="#10b981" strokeDasharray="3 3" />
                                                        </BarChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            </div>

                                            {/* 支出圓餅圖 */}
                                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                                <h4 className="text-sm font-bold text-slate-700 mb-4 text-center">支出結構分析</h4>
                                                <div className="flex-1 w-full min-h-0 relative">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <PieChart>
                                                            <Pie
                                                                data={financialData.pieData}
                                                                cx="50%"
                                                                cy="50%"
                                                                innerRadius={60}
                                                                outerRadius={80}
                                                                paddingAngle={5}
                                                                dataKey="value"
                                                            >
                                                                {financialData.pieData.map((entry, index) => (
                                                                    <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                                ))}
                                                            </Pie>
                                                            <Tooltip formatter={(value) => formatMoney(value)} />
                                                            <Legend verticalAlign="bottom" height={36} iconType="circle"/>
                                                        </PieChart>
                                                    </ResponsiveContainer>
                                                    {/* 中央文字 */}
                                                    <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-8">
                                                        <div className="text-xs text-slate-400">總支出</div>
                                                        <div className="text-sm font-bold text-slate-700">{Math.round(financialData.totalExpense / 10000)} 萬</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* 底部資訊 & 計算公式 */}
                                        <div className="space-y-4">
                                            <div className="bg-slate-100 p-4 rounded-lg flex flex-col md:flex-row justify-between items-center text-sm border border-slate-200 gap-2">
                                                <div className="text-slate-600 flex items-center gap-2">
                                                    <Users size={16} />
                                                    <span className="font-bold">生均成本 (Cost per Student):</span> {formatMoney(financialData.costPerStudent)}
                                                </div>
                                                <div className="text-slate-500 text-xs">
                                                    * 計算基礎：學期制 (6個月) | 人事費含 1.2 倍係數 (雇主負擔/退撫)
                                                </div>
                                            </div>

                                            {/* 財務計算公式說明 */}
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                                <h4 className="font-bold text-slate-700 mb-3 flex items-center gap-2 text-sm">
                                                    <Info size={16} className="text-indigo-500"/> 財務計算公式說明
                                                </h4>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-slate-600">
                                                    <div className="flex flex-col gap-1">
                                                        <span className="font-bold text-slate-700">總收入 (Total Income)</span>
                                                        <div className="font-mono bg-white px-2 py-1 rounded border border-slate-200 shadow-sm text-slate-500">學生人數 × 學雜費</div>
                                                    </div>
                                                    <div className="flex flex-col gap-1">
                                                        <span className="font-bold text-slate-700">人事成本 (Personnel Cost)</span>
                                                        <div className="font-mono bg-white px-2 py-1 rounded border border-slate-200 shadow-sm text-slate-500">教職員數 × 月薪 × 6 × 1.2 (係數)</div>
                                                    </div>
                                                    <div className="flex flex-col gap-1">
                                                        <span className="font-bold text-slate-700">營運成本 (Operation Cost)</span>
                                                        <div className="font-mono bg-white px-2 py-1 rounded border border-slate-200 shadow-sm text-slate-500">固定成本 + (學生數 × 變動成本)</div>
                                                    </div>
                                                    <div className="flex flex-col gap-1">
                                                        <span className="font-bold text-slate-700">淨損益 (Net Profit)</span>
                                                        <div className="font-mono bg-white px-2 py-1 rounded border border-slate-200 shadow-sm text-slate-500">總收入 - (人事成本 + 營運成本)</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                            {/* --- Summary Tab --- */}
                            {activeTab === 'summary' && (
                                <div className="space-y-4 animate-fadeIn">
                                    <h2 className="text-lg font-bold mb-4 border-l-4 border-indigo-600 pl-3">教學配課統計 (14 師 / 140 節)</h2>
                                    <div className="overflow-x-auto rounded-lg border border-slate-200">
                                        <table className="w-full border-collapse text-sm">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-600 text-left">
                                                    <th className="border-b p-4 font-bold">人員分類</th>
                                                    <th className="border-b p-4 font-bold">代碼與科目</th>
                                                    <th className="border-b p-4 text-right font-bold">每人節數</th>
                                                    <th className="border-b p-4 text-right font-bold">小計</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr className="hover:bg-slate-50"><td className="border-b p-4 font-semibold">中師主任 (3位)</td><td className="border-b p-4 text-slate-500">CT1-3 品德/閱讀/社會</td><td className="border-b p-4 text-right">2 節</td><td className="border-b p-4 text-right">6 節</td></tr>
                                                <tr className="hover:bg-slate-50"><td className="border-b p-4 font-semibold">中師組長 (4位)</td><td className="border-b p-4 text-slate-500">CT4-7 國語/數學</td><td className="border-b p-4 text-right">8.5 節</td><td className="border-b p-4 text-right">34 節</td></tr>
                                                <tr className="bg-emerald-50/50 hover:bg-emerald-50"><td className="border-b p-4 font-semibold text-emerald-800">外師導師 (4位)</td><td className="border-b p-4 text-emerald-600">ET1-4 LA/Social/Science/部分探索</td><td className="border-b p-4 text-right">15 節</td><td className="border-b p-4 text-right">60 節</td></tr>
                                                <tr className="bg-emerald-50/50 hover:bg-emerald-50"><td className="border-b p-4 font-semibold text-emerald-800">外師兼任 (3位)</td><td className="border-b p-4 text-emerald-600">ET5-7 Arts/PE/部分探索</td><td className="border-b p-4 text-right">12 節</td><td className="border-b p-4 text-right">36 節</td></tr>
                                                <tr className="bg-slate-800 text-white font-bold"><td colSpan="3" className="p-4 text-right">每週總授課量</td><td className="p-4 text-right">140 節</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                            
                            {/* --- 班級課表 Tab --- */}
                            {(classSchedules[activeTab]) && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-bold text-slate-800 flex items-center">
                                            <span className="bg-indigo-600 text-white px-3 py-1 rounded mr-3 text-lg shadow">{activeTab}</span>
                                            班級課表
                                        </h2>
                                        <div className="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                                            導師：{activeTab.includes('1') ? '中師 + 外師 (ET1/ET2)' : '中師 + 外師 (ET3/ET4)'}
                                        </div>
                                    </div>
                                    
                                    <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                                        <table className="w-full border-collapse text-sm text-center">
                                            <thead>
                                                <tr className="bg-slate-800 text-white">
                                                    <th className="border-r border-slate-700 p-3 w-24 whitespace-nowrap">節次</th>
                                                    {days.map(d => <th key={d} className="border-r border-slate-700 p-3 min-w-[120px]">{d}</th>)}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {classSchedules[activeTab].map((row, rowIdx) => {
                                                    const periodName = `第 ${rowIdx + 1} 節`;
                                                    const timeInfo = timeTable.find(t => t.period === periodName);
                                                    return (
                                                        <tr key={rowIdx} className="hover:bg-slate-50 transition-colors border-b border-slate-100">
                                                            <td className="border-r border-slate-200 p-2 bg-slate-100 font-bold text-slate-700">
                                                                <div className="whitespace-nowrap">{periodName}</div>
                                                                <div className="text-[10px] font-mono text-slate-500 mt-1 whitespace-nowrap">{timeInfo ? timeInfo.time : ''}</div>
                                                            </td>
                                                            {row.map((subject, colIdx) => {
                                                                let cellClass = "border-r border-slate-100 p-3 ";
                                                                if (subject.includes('ET')) cellClass += "text-emerald-700 bg-emerald-50/30 font-medium";
                                                                else if (subject.includes('CT')) cellClass += "text-indigo-700 bg-indigo-50/30 font-medium";
                                                                else cellClass += "text-slate-600";
                                                                return <td key={colIdx} className={cellClass}>{subject}</td>;
                                                            })}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="text-xs text-slate-500 mt-4 text-right flex justify-end gap-4">
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-indigo-500"></span> CT: 中師授課</span>
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-500"></span> ET: 外師授課</span>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<SchoolScheduleApp />);
    </script>
</body>
</html>
